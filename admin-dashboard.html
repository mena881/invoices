<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نظام إدارة الاستلامات</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --secondary: #7c3aed;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --dark: #0f172a;
            --dark-secondary: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #f1f5f9;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: white;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0,0,0,0.15);
            transform: translateX(0);
        }

        .sidebar.hidden { transform: translateX(100%); }

        .sidebar-header {
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 15px;
        }

        .sidebar-header .logo-icon {
            font-size: 40px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
        }

        .sidebar-menu li {
            padding: 12px 16px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar-menu li i { width: 22px; font-size: 16px; }
        .sidebar-menu li:hover { 
            background: rgba(255,255,255,0.08); 
            color: white;
            transform: translateX(-4px);
        }
        .sidebar-menu li.active { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white;
            box-shadow: 0 4px 15px rgba(79,70,229,0.4);
        }

        .logout-btn {
            margin: 20px 15px 30px;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            width: calc(100% - 30px);
        }
        .logout-btn:hover { 
            background: var(--danger); 
            border-color: var(--danger);
            color: white;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-right: 280px;
            padding: 20px 25px;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }
        .main-content.sidebar-hidden { margin-right: 0; }

        /* HEADER */
        .header {
            background: white;
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            background: var(--dark-secondary);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 12px;
            transition: var(--transition);
        }
        .menu-toggle:hover { background: var(--primary); }

        .header h1 {
            font-size: 22px;
            color: var(--dark-secondary);
            font-weight: 700;
        }
        .header h1 i { color: var(--primary); margin-left: 10px; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--light);
            padding: 6px 16px 6px 20px;
            border-radius: 40px;
            border: 1px solid var(--gray-light);
        }
        .user-info i { font-size: 22px; color: var(--primary); }
        .user-info span { font-weight: 600; color: var(--dark-secondary); font-size: 14px; }

        /* STATS CARDS */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            padding: 20px 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover { 
            transform: translateY(-4px); 
            box-shadow: var(--shadow);
        }

        .stat-card .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
        }
        .stat-card .stat-icon.blue { background: var(--info-light); color: var(--info); }
        .stat-card .stat-icon.green { background: var(--success-light); color: var(--success); }
        .stat-card .stat-icon.yellow { background: var(--warning-light); color: var(--warning); }
        .stat-card .stat-icon.red { background: var(--danger-light); color: var(--danger); }
        .stat-card .stat-icon.purple { background: #ede9fe; color: var(--secondary); }

        .stat-card .stat-label {
            font-size: 13px;
            color: var(--gray);
            font-weight: 500;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--dark-secondary);
            margin-top: 2px;
        }

        /* CHARTS */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .chart-container {
            background: white;
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .chart-container h4 {
            font-size: 16px;
            color: var(--dark-secondary);
            font-weight: 700;
            margin-bottom: 15px;
        }
        .chart-container h4 i { color: var(--primary); margin-left: 8px; }
        canvas { max-height: 230px; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            animation: slideUp 0.3s ease;
            font-weight: 600;
        }
        .toast.error { background: var(--danger); }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .main-content { margin-right: 0; }
            .sidebar { transform: translateX(100%); }
            .sidebar.visible { transform: translateX(0); }
            .sidebar.hidden { transform: translateX(100%); }
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
            .header h1 { font-size: 17px; }
            .stat-card .stat-value { font-size: 22px; }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 14px 16px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h1>
            </div>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="currentAdminName">مرحباً، مدير النظام</span>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div class="cards-grid" id="statsCards">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-file-invoice"></i></div>
                <div class="stat-label">إجمالي الفواتير</div>
                <div class="stat-value" id="totalReceipts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-cut"></i></div>
                <div class="stat-label">إجمالي القطع</div>
                <div class="stat-value" id="totalPieces">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-user-friends"></i></div>
                <div class="stat-label">الموظفين</div>
                <div class="stat-value" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon yellow"><i class="fas fa-factory"></i></div>
                <div class="stat-label">المصانع</div>
                <div class="stat-value" id="totalFactories">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-clock"></i></div>
                <div class="stat-label">جديدة</div>
                <div class="stat-value" id="newReceipts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                <div class="stat-label">مكتملة</div>
                <div class="stat-value" id="completedReceipts">0</div>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-container"><h4><i class="fas fa-chart-pie"></i> توزيع الفواتير</h4><canvas id="statusChart"></canvas></div>
            <div class="chart-container"><h4><i class="fas fa-chart-line"></i> الموديلات الأكثر طلباً</h4><canvas id="modelsChart"></canvas></div>
        </div>
    </div>

    <!-- MAIN JS -->
    <script src="main.js"></script>

    <script>
        // ============================================================
        // DASHBOARD LOGIC
        // ============================================================
        let statusChart = null;
        let modelsChart = null;

        async function loadDashboard() {
            const snapshot = await db.ref('receipts').once('value');
            let totalReceipts = 0, totalPieces = 0, newCount = 0, completedCount = 0;
            let modelsCount = {};
            let statusCounts = { new: 0, assigned: 0, in_progress: 0, completed: 0, closed: 0, cancelled: 0 };

            snapshot.forEach(child => {
                const r = child.val();
                if (r.isArchived) return;
                totalReceipts++;
                totalPieces += r.receivedQty || 0;
                
                const status = r.status || 'new';
                statusCounts[status] = (statusCounts[status] || 0) + 1;
                if (status === 'new') newCount++;
                if (status === 'completed') completedCount++;

                if (r.models && Array.isArray(r.models)) {
                    r.models.forEach(m => {
                        if (m.modelName) {
                            modelsCount[m.modelName] = (modelsCount[m.modelName] || 0) + (m.quantity || 0);
                        }
                    });
                }
            });

            const blankSnapshot = await db.ref('blankReceipts').once('value');
            blankSnapshot.forEach(child => {
                const br = child.val();
                if (br.closedDate) {
                    statusCounts.closed = (statusCounts.closed || 0) + 1;
                } else {
                    statusCounts.blank = (statusCounts.blank || 0) + 1;
                }
                totalReceipts++;
            });

            document.getElementById('totalReceipts').innerText = totalReceipts;
            document.getElementById('totalPieces').innerText = totalPieces;
            document.getElementById('newReceipts').innerText = newCount;
            document.getElementById('completedReceipts').innerText = completedCount;

            const usersSnap = await db.ref('users').once('value');
            let empCount = 0;
            usersSnap.forEach(u => { if (u.val().role === 'employee') empCount++; });
            document.getElementById('totalEmployees').innerText = empCount;

            const factSnap = await db.ref('factories').once('value');
            document.getElementById('totalFactories').innerText = factSnap.size;

            if (statusChart) statusChart.destroy();
            statusChart = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['جديدة', 'مسندة', 'تحت التنفيذ', 'مكتملة', 'مغلقة', 'ملغية', 'مسودة'],
                    datasets: [{
                        data: [statusCounts.new, statusCounts.assigned, statusCounts.in_progress, 
                               statusCounts.completed, statusCounts.closed, statusCounts.cancelled, statusCounts.blank || 0],
                        backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444', '#10b981', '#065f46', '#94a3b8', '#fcd34d']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            if (modelsChart) modelsChart.destroy();
            const topModels = Object.entries(modelsCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
            modelsChart = new Chart(document.getElementById('modelsChart'), {
                type: 'bar',
                data: {
                    labels: topModels.map(m => m[0]),
                    datasets: [{ label: 'الكمية', data: topModels.map(m => m[1]), backgroundColor: '#4f46e5' }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('visible');
            mainContent.classList.toggle('sidebar-hidden');
        }

        // Close sidebar on outside click
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.menu-toggle');
            const mainContent = document.getElementById('mainContent');
            
            const isSidebarVisible = sidebar.classList.contains('visible') && !sidebar.classList.contains('hidden');
            
            if (isSidebarVisible) {
                const isClickInsideSidebar = sidebar.contains(event.target);
                const isClickOnMenuToggle = menuToggle && menuToggle.contains(event.target);
                
                if (!isClickInsideSidebar && !isClickOnMenuToggle) {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('visible');
                    mainContent.classList.remove('sidebar-hidden');
                }
            }
        });

        // Handle resize
        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (window.innerWidth > 992) {
                sidebar.classList.remove('hidden');
                sidebar.classList.remove('visible');
                mainContent.classList.remove('sidebar-hidden');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('visible');
                mainContent.classList.add('sidebar-hidden');
            }
        });

        // Init
        loadDashboard();
    </script>

</body>
</html>
