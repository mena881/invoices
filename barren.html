<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>نظام الجرد · Inventory</title>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
                   RESET & BASE
                   ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            background: #f6f8fc;
            min-height: 100vh;
            font-size: 15px;
            color: #0b1b2f;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e6edf5;
            border-radius: 12px;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c8cff;
            border-radius: 12px;
        }

        /* =========================================================
                   HEADER
                   ========================================================= */
        .header {
            background: #0b1b2f;
            color: #fff;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 4px 24px rgba(0, 20, 40, 0.12);
            position: sticky;
            top: 0;
            z-index: 120;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            color: #6c8cff;
            font-size: 1.4rem;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px 4px 6px;
            border-radius: 40px;
        }
        .user-info span {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d3deff;
        }
        .user-info span i {
            color: #6c8cff;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logout-btn:hover {
            background: #d14c4c;
            border-color: #d14c4c;
            transform: scale(1.02);
        }

        /* =========================================================
                   CONTAINER
                   ========================================================= */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px 80px;
        }

        /* =========================================================
                   STATS
                   ========================================================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #ffffff;
            padding: 22px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 20, 40, 0.04);
            transition: all 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.02);
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.08);
        }
        .stat-icon {
            font-size: 28px;
            color: #6c8cff;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0b1b2f;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #6d7b93;
            font-weight: 500;
            margin-top: 2px;
        }

        /* =========================================================
                   TABS
                   ========================================================= */
        .tab-container {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            border-bottom: 2px solid #e6edf5;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
            scrollbar-width: thin;
        }
        .tab-container::-webkit-scrollbar {
            height: 4px;
        }
        .tab-container::-webkit-scrollbar-track {
            background: #e6edf5;
            border-radius: 12px;
        }
        .tab-container::-webkit-scrollbar-thumb {
            background: #6c8cff;
            border-radius: 12px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            color: #6d7b93;
            transition: all 0.2s;
            border-radius: 12px 12px 0 0;
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn i {
            font-size: 1rem;
            opacity: 0.7;
        }
        .tab-btn:hover {
            color: #0b1b2f;
            background: #f0f4fe;
        }
        .tab-btn.active {
            color: #1f3a8a;
            background: #f0f4fe;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: #6c8cff;
            border-radius: 4px;
        }
        .tab-content {
            display: none;
            animation: fadeSlide 0.25s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
                   SEARCH & FILTER
                   ========================================================= */
        .search-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0, 20, 40, 0.04);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .search-box input {
            flex: 1;
            padding: 10px 18px;
            border: 1px solid #e6edf5;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            min-width: 160px;
            transition: border-color 0.2s;
            background: #fafcff;
        }
        .search-box input:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }
        .search-box button {
            background: #6c8cff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box button:hover {
            background: #5a77e0;
            transform: scale(1.02);
        }

        /* =========================================================
                   INVENTORY LIST
                   ========================================================= */
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inventory-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(0, 20, 40, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .inventory-card:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.08);
            border-color: #6c8cff40;
        }
        .inventory-card.closed {
            opacity: 0.85;
            background: #f8faff;
            border-right: 5px solid #3dbb7a;
        }
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        .inventory-code {
            font-weight: 700;
            font-size: 1rem;
            color: #0b1b2f;
            background: #f0f4fe;
            padding: 4px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .inventory-code i {
            color: #6c8cff;
        }
        .inventory-badge {
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-open {
            background: #fef5e7;
            color: #b45b0a;
        }
        .badge-closed {
            background: #ddf4e8;
            color: #0e7b4a;
        }
        .badge-type {
            background: #e5eeff;
            color: #1f3a8a;
        }
        .inventory-details {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.85rem;
            color: #4e5e77;
        }
        .inventory-details span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .inventory-progress {
            margin-top: 14px;
        }
        .progress-bar {
            height: 6px;
            background: #e6edf5;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c8cff, #8b7bf7);
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        .progress-text {
            font-size: 0.75rem;
            color: #6d7b93;
            margin-top: 6px;
            text-align: left;
            font-weight: 500;
        }

        /* =========================================================
                   DETAIL
                   ========================================================= */
        .inventory-detail {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 32px;
            margin-top: 24px;
            box-shadow: 0 8px 32px rgba(0, 20, 40, 0.08);
            display: none;
            animation: fadeSlide 0.25s ease;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f4fe;
        }
        .detail-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b1b2f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .close-detail {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #8a9bb0;
            padding: 4px 10px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .close-detail:hover {
            background: #f0f4fe;
            color: #0b1b2f;
        }
        .summary-bar {
            background: linear-gradient(135deg, #f0f4fe, #e8edfe);
            border-radius: 20px;
            padding: 18px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 16px;
            color: #0b1b2f;
            border: 1px solid rgba(108, 140, 255, 0.15);
        }
        .summary-item {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }
        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .summary-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #4e5e77;
            opacity: 0.8;
        }
        .info-row {
            background: #f8faff;
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 0.85rem;
            border: 1px solid #e6edf5;
        }
        .info-row span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-row strong {
            color: #0b1b2f;
        }

        /* =========================================================
                   MODELS GRID (for detailed view)
                   ========================================================= */
        .models-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 24px;
        }
        .model-card {
            background: #fafcff;
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid #e6edf5;
            transition: border-color 0.2s;
            position: relative;
        }
        .model-card:hover {
            border-color: #6c8cff60;
        }
        .model-card.closed-model {
            background: #f6f9ff;
            opacity: 0.9;
            border-right: 5px solid #3dbb7a;
        }
        .model-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1f3a8a;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.2s;
        }
        .model-title:hover {
            color: #0b1b2f;
        }
        .model-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .model-title-left .toggle-icon {
            transition: transform 0.3s ease;
            display: inline-block;
            font-size: 1rem;
            color: #6c8cff;
            background: #e8edfe;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .model-title-left .toggle-icon.open {
            transform: rotate(180deg);
        }
        .model-title-left .toggle-icon i {
            font-size: 0.9rem;
        }
        .model-total-badge {
            background: #6c8cff;
            color: #fff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .model-status {
            background: #e5eeff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1f3a8a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .model-type-badge {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .model-type-new {
            background: #fef5e7;
            color: #b45b0a;
        }
        .model-type-repeat {
            background: #e5eeff;
            color: #1f3a8a;
        }
        .model-code-badge {
            font-size: 0.7rem;
            background: #e6edf5;
            padding: 2px 12px;
            border-radius: 30px;
            color: #4e5e77;
        }

        /* =========================================================
                   LOCATION INPUT
                   ========================================================= */
        .location-input-area {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .location-input-area label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #0b1b2f;
        }
        .location-input-area input {
            flex: 1;
            min-width: 120px;
            padding: 8px 14px;
            border: 1px solid #e6edf5;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            background: #fafcff;
            transition: border-color 0.2s;
        }
        .location-input-area input:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }
        .location-input-area input:disabled {
            background: #e6edf5;
            color: #6d7b93;
        }

        /* =========================================================
                   COLORS CONTAINER (for detailed view with colors & sizes)
                   ========================================================= */
        .colors-container {
            margin-bottom: 16px;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            padding: 16px 18px;
            background: #ffffff;
            transition: border-color 0.2s;
        }
        .colors-container:hover {
            border-color: #6c8cff40;
        }
        .color-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }
        .color-name-input {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .color-toggle-btn {
            background: #6c8cff;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .color-toggle-btn:hover {
            transform: scale(1.05);
        }
        .add-color-btn {
            background: #6c8cff;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
            font-weight: 600;
        }
        .add-color-btn:hover {
            background: #5a77e0;
        }
        .delete-color-btn {
            background: #e14c4c;
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .delete-color-btn:hover {
            background: #c03939;
            transform: scale(1.02);
        }

        .color-sizes-wrapper {
            display: none;
            margin-top: 12px;
            padding-right: 18px;
            border-right: 3px solid #6c8cff;
        }
        .color-sizes-wrapper.open {
            display: block;
        }
        .model-content-wrapper {
            display: none;
            margin-top: 14px;
        }
        .model-content-wrapper.open {
            display: block;
        }

        /* =========================================================
                   SIZES & QTY (for detailed view with colors & sizes)
                   ========================================================= */
        .sizes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .size-item {
            background: #f8faff;
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid #e6edf5;
        }
        .size-name {
            font-weight: 600;
            margin-bottom: 6px;
            color: #0b1b2f;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .qty-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .qty-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 14px;
        }
        .qty-box {
            background: #f8faff;
            border: 1px solid #e6edf5;
            border-radius: 30px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            transition: border-color 0.2s;
        }
        .qty-box:hover {
            border-color: #6c8cff60;
        }
        .qty-box input {
            width: 70px;
            border: none;
            text-align: center;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: transparent;
            font-weight: 600;
            padding: 4px 0;
            color: #0b1b2f;
        }
        .qty-box input:focus {
            outline: none;
        }
        .qty-box input:disabled {
            background: #e6edf5;
            color: #6d7b93;
            border-radius: 20px;
        }
        .qty-box input[value="0"] {
            color: transparent;
        }
        .qty-box input[value="0"]:focus {
            color: #0b1b2f;
        }
        .qty-box button {
            background: #6c8cff;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .qty-box button:hover {
            transform: scale(1.05);
        }
        .qty-box button.danger {
            background: #e14c4c;
        }
        .qty-box button.danger:hover {
            background: #c03939;
        }
        .qty-box button:disabled {
            background: #bcc8db;
            cursor: not-allowed;
            transform: none;
        }
        .total-received {
            font-size: 0.75rem;
            color: #1f3a8a;
            font-weight: 600;
            background: #e5eeff;
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* =========================================================
                   MODEL NOTE AREA
                   ========================================================= */
        .model-note-area {
            margin-top: 14px;
        }
        .model-note-area textarea {
            width: 100%;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid #e6edf5;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 50px;
            transition: border-color 0.2s;
            background: #ffffff;
            color: #0b1b2f;
        }
        .model-note-area textarea:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.15);
        }

        /* =========================================================
                   FULL QUANTITY INVENTORY (Tab 2)
                   ========================================================= */
        .full-qty-model-row {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            background: #fafcff;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #e6edf5;
        }
        .full-qty-model-row .model-search-container {
            flex: 2;
            position: relative;
        }
        .full-qty-model-row input[type="number"] {
            width: 120px;
            padding: 10px 14px;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            text-align: center;
        }
        .full-qty-model-row input[type="number"]:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }
        .full-qty-model-row input[type="number"]:disabled {
            background: #e6edf5;
            color: #6d7b93;
        }
        .full-qty-total {
            background: #e5eeff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f3a8a;
        }
        .add-full-qty-btn {
            background: #6c8cff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 16px;
            width: 100%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-full-qty-btn:hover {
            background: #5a77e0;
        }

        /* =========================================================
                   BUTTONS
                   ========================================================= */
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn-primary {
            background: #6c8cff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #5a77e0;
        }
        .btn-success {
            background: #3dbb7a;
            color: #fff;
        }
        .btn-success:hover {
            background: #2ea36a;
        }
        .btn-warning {
            background: #f5a623;
            color: #fff;
        }
        .btn-warning:hover {
            background: #d98e1a;
        }
        .btn-danger {
            background: #e14c4c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c03939;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        /* =========================================================
                   MODALS
                   ========================================================= */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 27, 47, 0.5);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            animation: fadeSlide 0.2s ease;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 36px;
            max-width: 520px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 20, 40, 0.2);
        }
        .modal-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b1b2f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-content p {
            color: #4e5e77;
            margin-top: 8px;
        }
        .modal-content .form-group {
            margin-top: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #0b1b2f;
            font-size: 0.85rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #fafcff;
            color: #0b1b2f;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }

        /* Confirm Close Modal */
        .confirm-close-modal .modal-content {
            max-width: 560px;
        }
        .confirm-close-modal .close-summary {
            background: #f8faff;
            border-radius: 16px;
            padding: 16px 20px;
            margin: 16px 0;
            border: 1px solid #e6edf5;
        }
        .confirm-close-modal .close-summary-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f0f4fe;
            font-size: 0.9rem;
        }
        .confirm-close-modal .close-summary-item:last-child {
            border-bottom: none;
        }
        .close-warning {
            color: #e14c4c;
            font-weight: 700;
            padding: 12px 16px;
            background: #fef5f5;
            border-radius: 12px;
            border: 1px solid #fce4e4;
            margin: 12px 0;
        }

        .close-inventory-btn {
            background: #3dbb7a;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            margin-top: 16px;
            width: 100%;
        }
        .close-inventory-btn:hover {
            background: #2ea36a;
            box-shadow: 0 4px 16px rgba(61, 187, 122, 0.25);
            transform: scale(1.01);
        }
        .close-inventory-btn:disabled {
            background: #bcc8db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .close-inventory-full-btn {
            background: #f5a623;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 16px;
        }
        .close-inventory-full-btn:hover {
            background: #d98e1a;
            transform: scale(1.01);
            box-shadow: 0 4px 16px rgba(245, 166, 35, 0.25);
        }
        .close-inventory-full-btn:disabled {
            background: #bcc8db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* =========================================================
                   INDICATORS
                   ========================================================= */
        .auto-save-indicator {
            position: fixed;
            bottom: 28px;
            left: 28px;
            background: #3dbb7a;
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 28px rgba(61, 187, 122, 0.25);
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .warning-indicator {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #f5a623;
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 28px rgba(245, 166, 35, 0.2);
            align-items: center;
            gap: 10px;
            max-width: 90%;
            font-weight: 500;
        }
        .warning-indicator.error {
            background: #e14c4c;
            box-shadow: 0 8px 28px rgba(225, 76, 76, 0.2);
        }
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #e6edf5;
        }
        .empty-state i {
            font-size: 2.8rem;
            color: #6c8cff;
            opacity: 0.4;
            margin-bottom: 12px;
        }
        .empty-state p {
            color: #6d7b93;
            font-size: 0.95rem;
        }

        .load-more-btn {
            background: #f0f4fe;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: #1f3a8a;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .load-more-btn:hover {
            background: #e5eeff;
            transform: scale(1.01);
        }
        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .edit-inline {
            cursor: text;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .edit-inline:hover {
            background: #e8edfe;
        }

        /* =========================================================
                   RESPONSIVE
                   ========================================================= */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px 80px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card {
                padding: 16px 12px;
            }
            .stat-value {
                font-size: 1.6rem;
            }
            .stat-label {
                font-size: 0.7rem;
            }
            .summary-bar {
                flex-direction: column;
                gap: 8px;
                padding: 16px;
            }
            .summary-item {
                min-width: auto;
            }
            .summary-value {
                font-size: 1.6rem;
            }
            .inventory-card {
                padding: 16px 18px;
            }
            .detail-header {
                flex-direction: column;
                align-items: stretch;
            }
            .detail-actions {
                width: 100%;
                flex-wrap: wrap;
            }
            .detail-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .header {
                padding: 12px 16px;
            }
            .header h1 {
                font-size: 1rem;
            }
            .user-info {
                font-size: 0.8rem;
                padding: 2px 10px 2px 4px;
            }
            .inventory-detail {
                padding: 20px 18px;
            }
            .modal-content {
                padding: 24px 20px;
            }
            .model-title {
                font-size: 0.9rem;
            }
            .qty-box {
                min-width: 120px;
            }
            .qty-box input {
                width: 56px;
                font-size: 0.9rem;
            }
            .full-qty-model-row {
                flex-direction: column;
                gap: 10px;
            }
            .full-qty-model-row input[type="number"] {
                width: 100%;
            }
            .confirm-close-modal .modal-content {
                padding: 24px 20px;
            }
            .auto-save-indicator,
            .warning-indicator {
                bottom: 16px;
                left: 16px;
                right: 16px;
                width: auto;
                max-width: calc(100% - 32px);
                font-size: 0.75rem;
                padding: 8px 16px;
                border-radius: 30px;
            }
            .warning-indicator {
                right: 16px;
                left: 16px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stats-grid .stat-card:last-child {
                grid-column: span 2;
            }
            .summary-bar {
                flex-direction: column;
            }
            .summary-item {
                min-width: auto;
            }
            .detail-actions {
                flex-direction: column;
            }
            .detail-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* =========================================================
                   FULL QTY - ENTRY ROW STYLING
                   ========================================================= */
        .full-qty-entries {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .full-qty-entry {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8faff;
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid #e6edf5;
            flex-wrap: wrap;
        }
        .full-qty-entry .entry-factory {
            font-weight: 600;
            color: #1f3a8a;
            min-width: 60px;
        }
        .full-qty-entry .entry-model {
            flex: 1;
            font-weight: 500;
        }
        .full-qty-entry .entry-qty {
            font-weight: 700;
            color: #0b1b2f;
            min-width: 50px;
            text-align: center;
        }
        .full-qty-entry .entry-remove {
            background: #e14c4c;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .full-qty-entry .entry-remove:hover {
            background: #c03939;
            transform: scale(1.05);
        }
        .full-qty-summary {
            background: #e5eeff;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1f3a8a;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .model-smart-badge {
            font-size: 0.7rem;
            padding: 3px 14px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-new {
            background: #fef5e7;
            color: #b45b0a;
        }
        .badge-repeat {
            background: #e5eeff;
            color: #1f3a8a;
        }
        .badge-sample {
            background: #ddf4e8;
            color: #0e7b4a;
        }
        .model-search-container {
            position: relative;
            flex: 2;
        }
        .model-search-input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            background: #fafcff;
        }
        .model-search-input:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }
        .model-search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e6edf5;
            border-top: none;
            border-radius: 0 0 16px 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.08);
        }
        .model-search-result {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #f0f4fe;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .model-search-result:hover {
            background: #f0f4fe;
        }
    </style>
</head>
<body>

    <!-- =========================================================
    HEADER
    ========================================================= -->
    <div class="header">
        <h1><i class="fas fa-clipboard-list"></i> نظام الجرد · Inventory</h1>
        <div class="user-info">
            <span><i class="fas fa-user-circle"></i> <span id="userName"></span></span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </div>

    <!-- =========================================================
    CONTAINER
    ========================================================= -->
    <div class="container">

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-file-invoice"></i></div>
                <div class="stat-value" id="totalInventory">0</div>
                <div class="stat-label">فواتير الجرد</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-boxes"></i></div>
                <div class="stat-value" id="totalItems">0</div>
                <div class="stat-label">إجمالي الموديلات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-value" id="totalQuantity">0</div>
                <div class="stat-label">إجمالي الكميات</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="pendingCount">0</div>
                <div class="stat-label">جاري الجرد</div>
            </div>
        </div>

        <!-- TABS -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('colorsSizes')">
                <i class="fas fa-palette"></i> جرد بالألوان والمقاسات
            </button>
            <button class="tab-btn" onclick="switchTab('fullQty')">
                <i class="fas fa-box"></i> جرد كمية كاملة
            </button>
        </div>

        <!-- =========================================================
        TAB 1: جرد بالألوان والمقاسات
        ========================================================= -->
        <div id="colorsSizesTab" class="tab-content active">

            <!-- SEARCH -->
            <div class="search-box">
                <input type="text" id="inventorySearch" placeholder="بحث برقم الفاتورة أو كود الموديل..." onkeyup="filterInventory()">
                <button onclick="filterInventory()"><i class="fas fa-search"></i> بحث</button>
            </div>

            <!-- CREATE INVENTORY BUTTON -->
            <button class="btn btn-primary" style="width:100%;margin-bottom:24px;justify-content:center;" onclick="openCreateInventoryPopup('colorsSizes')">
                <i class="fas fa-plus-circle"></i> + إنشاء فاتورة جرد (ألوان ومقاسات)
            </button>

            <!-- INVENTORY LIST -->
            <div id="colorsSizesList" class="inventory-list"></div>

            <!-- LOAD MORE -->
            <button class="load-more-btn" id="loadMoreColorsSizesBtn" onclick="loadMoreColorsSizes()">
                <i class="fas fa-chevron-down"></i> عرض المزيد
            </button>

            <!-- DETAIL -->
            <div id="colorsSizesDetail" class="inventory-detail" style="display:none;"></div>
        </div>

        <!-- =========================================================
        TAB 2: جرد كمية كاملة
        ========================================================= -->
        <div id="fullQtyTab" class="tab-content">

            <!-- SEARCH -->
            <div class="search-box">
                <input type="text" id="fullQtySearch" placeholder="بحث برقم الفاتورة أو كود الموديل..." onkeyup="filterFullQtyInventory()">
                <button onclick="filterFullQtyInventory()"><i class="fas fa-search"></i> بحث</button>
            </div>

            <!-- CREATE INVENTORY BUTTON -->
            <button class="btn btn-primary" style="width:100%;margin-bottom:24px;justify-content:center;" onclick="openCreateInventoryPopup('fullQty')">
                <i class="fas fa-plus-circle"></i> + إنشاء فاتورة جرد (كمية كاملة)
            </button>

            <!-- INVENTORY LIST -->
            <div id="fullQtyList" class="inventory-list"></div>

            <!-- LOAD MORE -->
            <button class="load-more-btn" id="loadMoreFullQtyBtn" onclick="loadMoreFullQty()">
                <i class="fas fa-chevron-down"></i> عرض المزيد
            </button>

            <!-- DETAIL -->
            <div id="fullQtyDetail" class="inventory-detail" style="display:none;"></div>
        </div>

    </div>

    <!-- =========================================================
    INDICATORS
    ========================================================= -->
    <div class="auto-save-indicator" id="autoSaveIndicator">
        <i class="fas fa-save"></i> <span id="saveStatusText">جاري الحفظ...</span> <span id="saveProgressText"></span>
    </div>
    <div class="warning-indicator" id="warningIndicator"></div>

    <!-- =========================================================
    MODALS
    ========================================================= -->

    <!-- Create Inventory Modal -->
    <div id="createInventoryPopup" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-clipboard-list"></i> إنشاء فاتورة جرد جديدة</h3>
            <div class="form-group" style="margin-top:18px;">
                <label><i class="fas fa-barcode"></i> كود الفاتورة</label>
                <input type="text" id="inventoryCode" placeholder="أدخل كود الفاتورة">
            </div>
            <div class="form-group">
                <label><i class="fas fa-factory"></i> المصنع</label>
                <div style="display:flex; gap:10px;">
                    <select id="inventoryFactorySelect" style="flex:1;">
                        <option value="">اختر مصنع</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="openFactoryModal()"><i class="fas fa-plus"></i> مصنع جديد</button>
                </div>
            </div>
            <input type="hidden" id="inventoryType" value="colorsSizes">
            <div id="inventoryCreateErrorMsg" style="color:#e14c4c; font-size:0.8rem; margin-bottom:10px;"></div>
            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:18px;">
                <button class="btn btn-primary" onclick="createInventory()">إنشاء</button>
                <button class="btn btn-danger" onclick="closeCreateInventoryPopup()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Add Model Modal (for colors & sizes tab) -->
    <div id="addModelModal" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-tshirt"></i> إضافة موديل جديد</h3>
            <div class="form-group" style="margin-top:18px;">
                <label>كود الموديل</label>
                <input type="text" id="newModelCode" placeholder="مثال: 3012">
            </div>
            <div id="modelErrorMsg" style="color:#e14c4c; font-size:0.8rem; margin-bottom:10px;"></div>
            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:18px;">

    <!-- =========================================================
    JAVASCRIPT
    ========================================================= -->
    <script>
        // ================================================================
        //  CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB7TgP9zI6LEc6yqfUyZqWYBqJyqL8oGxs",
            authDomain: "exams-fab0f.firebaseapp.com",
            databaseURL: "https://exams-fab0f-default-rtdb.firebaseio.com",
            projectId: "exams-fab0f",
            storageBucket: "exams-fab0f.firebasestorage.app",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abc123def456"
        };

        // ================================================================
        //  FIREBASE INIT
        // ================================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ================================================================
        //  GLOBAL STATE
        // ================================================================
        let currentUser = null;

        // Colors & Sizes Tab
        let csInventoryList = [];
        let csCurrentId = null;
        let csCurrentData = null;
        let csPage = 0;
        let csModelOpenState = {};
        let csColorOpenState = {};

        // Full Qty Tab
        let fqInventoryList = [];
        let fqCurrentId = null;
        let fqCurrentData = null;
        let fqPage = 0;

        // Shared
        let allSizesList = [];
        let allModelsList = [];
        let allFactoriesList = [];
        let receivedModelsHistory = new Set();
        let saveTimer = null;

        const EXCLUDED_TABLES = ['currentTable', 'invoices'];
        const ITEMS_PER_PAGE = 100;

        // Pending model search
        let csPendingModelSearch = {};
        let fqPendingModelSearch = {};

        // ================================================================
        //  HELPERS
        // ================================================================
        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function getColorStateKey(id, modelName, colorName) {
            return `${id}_${modelName}_${colorName}`;
        }

        function getModelStateKey(id, modelName) {
            return `${id}_${modelName}`;
        }

        function showWarning(message, isError = false) {
            const indicator = document.getElementById('warningIndicator');
            indicator.innerText = message;
            indicator.className = isError ? 'warning-indicator error' : 'warning-indicator';
            indicator.style.display = 'flex';
            clearTimeout(window.warningTimeout);
            window.warningTimeout = setTimeout(() => { indicator.style.display = 'none'; }, 3000);
        }

        function showAutoSave(status, progress = '') {
            const indicator = document.getElementById('autoSaveIndicator');
            const statusText = document.getElementById('saveStatusText');
            const progressText = document.getElementById('saveProgressText');
            if (status === 'saving') {
                statusText.innerText = 'جاري الحفظ...';
                progressText.innerText = progress;
                indicator.style.display = 'flex';
            } else if (status === 'saved') {
                statusText.innerText = 'تم الحفظ ✓';
                progressText.innerText = '';
                indicator.style.display = 'flex';
                clearTimeout(window.autoSaveTimeout);
                window.autoSaveTimeout = setTimeout(() => {
                    indicator.style.display = 'none';
                }, 1500);
            } else {
                indicator.style.display = 'none';
            }
        }

        function scheduleSave() {
            clearTimeout(saveTimer);
            showAutoSave('saving', '...');
            saveTimer = setTimeout(() => {
                showAutoSave('saved', '');
            }, 1000);
        }

        function getCurrentTab() {
            const activeBtn = document.querySelector('.tab-btn.active');
            if (activeBtn) {
                const onclick = activeBtn.getAttribute('onclick');
                if (onclick && onclick.includes('colorsSizes')) return 'colorsSizes';
                if (onclick && onclick.includes('fullQty')) return 'fullQty';
            }
            return 'colorsSizes';
        }

        // ================================================================
        //  AUTHENTICATION
        // ================================================================
        function checkAuth() {
            const user = localStorage.getItem('currentUser');
            if (!user) { window.location.href = 'index.html'; return; }
            try {
                currentUser = JSON.parse(user);
                if (!currentUser.userId && !currentUser.uid) {
                    db.ref('users').once('value').then((snapshot) => {
                        snapshot.forEach((child) => {
                            const userData = child.val();
                            if (userData.username === currentUser.username) {
                                currentUser.userId = child.key;
                                currentUser.uid = child.key;
                                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                            }
                        });
                    });
                }
                if (currentUser.role !== 'employee') { window.location.href = 'admin-dashboard.html'; return; }
                document.getElementById('userName').innerText = currentUser.fullName || currentUser.username;
                Promise.all([loadSizes(), loadAllModels(), loadAllFactories(), loadReceivedModelsHistory()])
                    .then(() => {
                        loadColorsSizesInventory();
                        loadFullQtyInventory();
                        loadDashboardStats();
                        loadInventoryFormData();
                        setupModalListeners();
                    });
            } catch (e) {
                console.error('Auth error:', e);
                window.location.href = 'index.html';
            }
        }

        // ================================================================
        //  DATA LOADING
        // ================================================================
        async function loadSizes() {
            const snapshot = await db.ref('sizes').once('value');
            allSizesList = [];
            snapshot.forEach(child => {
                allSizesList.push({ id: child.key, name: child.val().name.trim() });
            });
            allSizesList.sort((a, b) => {
                const order = ['S', 'M', 'L', 'XL', '2XL', '3XL', '4XL', '5XL', '6XL'];
                return order.indexOf(a.name) - order.indexOf(b.name);
            });
        }

        async function loadAllModels() {
            const snapshot = await db.ref('models').once('value');
            allModelsList = [];
            snapshot.forEach(child => {
                if (EXCLUDED_TABLES.includes(child.key)) return;
                allModelsList.push({
                    id: child.key,
                    name: child.val().name,
                    code: child.val().code || '',
                    factory: child.val().factory,
                    imageUrl: child.val().imageUrl || ''
                });
            });
        }

        async function loadAllFactories() {
            const snapshot = await db.ref('factories').once('value');
            allFactoriesList = [];
            snapshot.forEach(child => {
                if (EXCLUDED_TABLES.includes(child.key)) return;
                allFactoriesList.push({ id: child.key, name: child.val().name });
            });
        }

        async function loadReceivedModelsHistory() {
            receivedModelsHistory.clear();
            // From inventory
            const invSnapshot = await db.ref('inventory').once('value');
            invSnapshot.forEach((child) => {
                const inv = child.val();
                if (inv.modelColors) {
                    Object.keys(inv.modelColors).forEach(modelName => {
                        receivedModelsHistory.add(modelName);
                    });
                }
                if (inv.fullQtyEntries) {
                    inv.fullQtyEntries.forEach(entry => {
                        if (entry.modelName) receivedModelsHistory.add(entry.modelName);
                    });
                }
            });
            // From receipts
            const receiptSnapshot = await db.ref('receipts').once('value');
            receiptSnapshot.forEach((child) => {
                const receipt = child.val();
                if (receipt.models) {
                    receipt.models.forEach(model => {
                        if (model.modelName) receivedModelsHistory.add(model.modelName);
                        if (model.modelCode) receivedModelsHistory.add(model.modelCode);
                    });
                }
            });
        }

        // ================================================================
        //  TABS
        // ================================================================
        function switchTab(tab) {
            // Close any open detail
            if (csCurrentId && csCurrentData) { closeColorsSizesDetail(true); }
            if (fqCurrentId && fqCurrentData) { closeFullQtyDetail(true); }

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'colorsSizes') {
                document.querySelector('.tab-btn[onclick*="colorsSizes"]').classList.add('active');
                document.getElementById('colorsSizesTab').classList.add('active');
                loadColorsSizesInventory();
            } else {
                document.querySelector('.tab-btn[onclick*="fullQty"]').classList.add('active');
                document.getElementById('fullQtyTab').classList.add('active');
                loadFullQtyInventory();
            }
        }

        // ================================================================
        //  DASHBOARD STATS
        // ================================================================
        async function loadDashboardStats() {
            let totalInventory = 0;
            let totalItems = 0;
            let totalQuantity = 0;
            let pending = 0;

            const snapshot = await db.ref('inventory').once('value');
            snapshot.forEach((child) => {
                const inv = child.val();
                if (inv.assignedEmployeesUsernames && inv.assignedEmployeesUsernames.includes(currentUser.username)) {
                    totalInventory++;
                    if (!inv.isClosed) pending++;

                    // Count items and quantities
                    if (inv.type === 'fullQty' && inv.fullQtyEntries) {
                        // Full Qty type
                        const modelSet = new Set();
                        inv.fullQtyEntries.forEach(entry => {
                            if (entry.modelName) {
                                modelSet.add(entry.modelName);
                                totalQuantity += parseInt(entry.qty) || 0;
                            }
                        });
                        totalItems += modelSet.size;
                    } else if (inv.modelColors) {
                        // Colors & Sizes type
                        for (const modelName in inv.modelColors) {
                            totalItems++;
                            for (const colorName in inv.modelColors[modelName]) {
                                for (const sizeId in inv.modelColors[modelName][colorName]) {
                                    const sizeArray = inv.modelColors[modelName][colorName][sizeId] || [0];
                                    totalQuantity += sizeArray.reduce((a, b) => a + b, 0);
                                }
                            }
                        }
                    }
                }
            });

            document.getElementById('totalInventory').innerText = totalInventory;
            document.getElementById('totalItems').innerText = totalItems;
            document.getElementById('totalQuantity').innerText = totalQuantity;
            document.getElementById('pendingCount').innerText = pending;
        }

        // ================================================================
        //  INVENTORY FORM DATA
        // ================================================================
        async function loadInventoryFormData() {
            await loadAllFactories();
            const factorySelect = document.getElementById('inventoryFactorySelect');
            factorySelect.innerHTML = '<option value="">اختر مصنع</option>';
            allFactoriesList.forEach(f => {
                factorySelect.innerHTML += `<option value="${f.name}">${f.name}</option>`;
            });
        }

        // ================================================================
        //  CREATE INVENTORY
        // ================================================================
        function openCreateInventoryPopup(type) {
            document.getElementById('inventoryCode').value = '';
            document.getElementById('inventoryFactorySelect').value = '';
            document.getElementById('inventoryType').value = type || 'colorsSizes';
            document.getElementById('inventoryCreateErrorMsg').innerHTML = '';
            document.getElementById('createInventoryPopup').style.display = 'flex';
            loadInventoryFormData();
        }

        function closeCreateInventoryPopup() {
            document.getElementById('createInventoryPopup').style.display = 'none';
        }

        async function createInventory() {
            const invoiceCode = document.getElementById('inventoryCode').value.trim();
            const factory = document.getElementById('inventoryFactorySelect').value;
            const type = document.getElementById('inventoryType').value;

            if (!invoiceCode || !factory) {
                document.getElementById('inventoryCreateErrorMsg').innerHTML = 'الرجاء إدخال كود الفاتورة واختيار المصنع';
                return;
            }

            const inventoryData = {
                invoiceCode,
                factory,
                type: type,
                assignedEmployeesUsernames: [currentUser.username],
                assignedEmployees: [currentUser.fullName],
                isClosed: false,
                closedDate: null,
                createdAt: new Date().toISOString(),
                createdBy: currentUser.fullName,
                createdByUsername: currentUser.username,
                updatedAt: Date.now()
            };

            // Add type-specific fields
            if (type === 'fullQty') {
                inventoryData.fullQtyEntries = [];
                inventoryData.fullQtyTotals = {};
            } else {
                inventoryData.modelColors = {};
                inventoryData.modelNotes = {};
                inventoryData.modelLocations = {};
            }

            const ref = await db.ref('inventory').push(inventoryData);
            if (ref.key) {
                showWarning('تم إنشاء فاتورة الجرد بنجاح', false);
                closeCreateInventoryPopup();
                if (type === 'fullQty') {
                    loadFullQtyInventory();
                } else {
                    loadColorsSizesInventory();
                }
                loadDashboardStats();
            } else {
                showWarning('حدث خطأ في إنشاء الفاتورة', true);
            }
        }

        // ================================================================
        //  TAB 1: COLORS & SIZES INVENTORY
        // ================================================================
        async function loadColorsSizesInventory() {
            const snapshot = await db.ref('inventory').once('value');
            const inventory = [];

            snapshot.forEach((child) => {
                const inv = child.val();
                if (inv.type !== 'fullQty' &&
                    inv.assignedEmployeesUsernames &&
                    inv.assignedEmployeesUsernames.includes(currentUser.username)) {
                    inventory.push({ id: child.key, ...inv });
                }
            });

            inventory.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            csInventoryList = inventory;
            csPage = 0;
            renderColorsSizesList(inventory.slice(0, ITEMS_PER_PAGE));
            updateColorsSizesLoadMore(inventory.length);
        }

        function renderColorsSizesList(items) {
            const container = document.getElementById('colorsSizesList');
            if (items.length === 0 && csPage === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-palette"></i>
                        <p>لا توجد فواتير جرد بالألوان والمقاسات - أنشئ فاتورة جديدة</p>
                    </div>
                `;
                return;
            }
            if (items.length === 0 && csPage > 0) return;
            if (csPage === 0) container.innerHTML = '';

            items.forEach(inv => {
                let totalItems = 0;
                let totalQty = 0;
                if (inv.modelColors) {
                    for (const modelName in inv.modelColors) {
                        totalItems++;
                        for (const colorName in inv.modelColors[modelName]) {
                            for (const sizeId in inv.modelColors[modelName][colorName]) {
                                const sizeArray = inv.modelColors[modelName][colorName][sizeId] || [0];
                                totalQty += sizeArray.reduce((a, b) => a + b, 0);
                            }
                        }
                    }
                }

                const isClosed = inv.isClosed === true;

                container.innerHTML += `
                    <div class="inventory-card ${isClosed ? 'closed' : ''}" onclick="openColorsSizesDetail('${inv.id}')">
                        <div class="inventory-header">
                            <span class="inventory-code"><i class="fas fa-barcode"></i> ${inv.invoiceCode}</span>
                            <span class="inventory-badge ${isClosed ? 'badge-closed' : 'badge-open'}">${isClosed ? 'مقفلة' : 'مفتوحة'}</span>
                        </div>
                        <div class="inventory-details">
                            <span><i class="fas fa-factory"></i> ${inv.factory || '-'}</span>
                            <span><i class="fas fa-tags"></i> ${totalItems} موديل</span>
                            <span><i class="fas fa-boxes"></i> ${totalQty} قطعة</span>
                            <span class="inventory-badge badge-type"><i class="fas fa-palette"></i> ألوان ومقاسات</span>
                        </div>
                        <div class="inventory-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${isClosed ? 100 : Math.min(totalItems > 0 ? 50 : 0, 100)}%"></div>
                            </div>
                            <div class="progress-text">${isClosed ? '✅ مقفلة' : 'جاري الجرد...'}</div>
                        </div>
                    </div>
                `;
            });
        }

        function updateColorsSizesLoadMore(totalItems) {
            const btn = document.getElementById('loadMoreColorsSizesBtn');
            if (totalItems <= (csPage + 1) * ITEMS_PER_PAGE) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'flex';
            }
        }

        function loadMoreColorsSizes() {
            csPage++;
            const start = csPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const chunk = csInventoryList.slice(start, end);
            if (chunk.length > 0) {
                renderColorsSizesList(chunk);
                updateColorsSizesLoadMore(csInventoryList.length);
            }
        }

        function filterInventory() {
            const searchTerm = document.getElementById('inventorySearch').value.toLowerCase();
            const filtered = csInventoryList.filter(item =>
                item.invoiceCode.toLowerCase().includes(searchTerm) ||
                (item.modelColors && Object.keys(item.modelColors).some(m => m.toLowerCase().includes(searchTerm)))
            );
            csPage = 0;
            renderColorsSizesList(filtered.slice(0, ITEMS_PER_PAGE));
            updateColorsSizesLoadMore(filtered.length);
            window._csFiltered = filtered;
        }

        // ================================================================
        //  TAB 1: COLORS & SIZES - OPEN / CLOSE / RENDER DETAIL
        // ================================================================
        function closeColorsSizesDetail(silent = false) {
            document.getElementById('colorsSizesDetail').style.display = 'none';
            if (csCurrentId) {
                delete csModelOpenState[csCurrentId];
                delete csColorOpenState[csCurrentId];
            }
            csCurrentId = null;
            csCurrentData = null;
        }

        async function openColorsSizesDetail(inventoryId) {
            if (csCurrentId && csCurrentData) { closeColorsSizesDetail(true); }
            if (fqCurrentId && fqCurrentData) { closeFullQtyDetail(true); }

            csCurrentId = inventoryId;
            const snapshot = await db.ref(`inventory/${inventoryId}`).once('value');
            csCurrentData = snapshot.val();
            if (!csCurrentData) { showWarning('حدث خطأ في تحميل الفاتورة', true); return; }

            if (!csCurrentData.modelColors) csCurrentData.modelColors = {};
            if (!csCurrentData.modelNotes) csCurrentData.modelNotes = {};
            if (!csCurrentData.modelLocations) csCurrentData.modelLocations = {};

            if (!csModelOpenState[inventoryId]) csModelOpenState[inventoryId] = {};
            if (!csColorOpenState[inventoryId]) csColorOpenState[inventoryId] = {};

            renderColorsSizesDetail();
            setTimeout(() => {
                document.getElementById('colorsSizesDetail').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        function renderColorsSizesDetail() {
            if (!csCurrentData || !csCurrentId) return;
            const inv = csCurrentData;
            const id = csCurrentId;

            let totalItems = 0;
            let totalQty = 0;
            if (inv.modelColors) {
                for (const modelName in inv.modelColors) {
                    totalItems++;
                    for (const colorName in inv.modelColors[modelName]) {
                        for (const sizeId in inv.modelColors[modelName][colorName]) {
                            const sizeArray = inv.modelColors[modelName][colorName][sizeId] || [0];
                            totalQty += sizeArray.reduce((a, b) => a + b, 0);
                        }
                    }
                }
            }

            const isClosed = inv.isClosed === true;

            let modelsHtml = '';
            const modelNames = Object.keys(inv.modelColors || {});
            if (modelNames.length === 0) {
                modelsHtml = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <p>لا توجد موديلات بعد - أضف موديل جديد</p>
                    </div>
                `;
            } else {
                modelNames.forEach(modelName => {
                    const modelKey = getModelStateKey(id, modelName);
                    const isOpen = csModelOpenState[id]?.[modelKey] !== false;
                    const safeModelKey = modelName.replace(/[^a-zA-Z0-9]/g, '_');
                    const isModelFirstTime = !receivedModelsHistory.has(modelName);
                    const modelLocation = inv.modelLocations?.[modelName] || '';

                    let modelTotal = 0;
                    for (const colorName in inv.modelColors[modelName]) {
                        modelTotal += calculateTotalForColor(inv, modelName, colorName);
                    }

                    const modelTypeBadge = isModelFirstTime ?
                        '<span class="model-type-badge model-type-new"><i class="fas fa-camera"></i> موديل جديد</span>' :
                        '<span class="model-type-badge model-type-repeat"><i class="fas fa-sync-alt"></i> موديل مكرر</span>';

                    let colorsHtml = '';
                    const colorNames = Object.keys(inv.modelColors[modelName]);
                    colorNames.forEach(colorName => {
                        const colorKey = getColorStateKey(id, modelName, colorName);
                        const isColorOpen = csColorOpenState[id]?.[colorKey] !== false;
                        const colorData = inv.modelColors[modelName][colorName];
                        const colorTotal = calculateTotalForColor(inv, modelName, colorName);
                        const safeColorKey = colorName.replace(/[^a-zA-Z0-9]/g, '_');

                        let sizesHtml = '';
                        allSizesList.forEach(({ id: sizeId, name: sizeName }) => {
                            const sizeArray = colorData[sizeId] || [0];
                            const sizeTotal = sizeArray.reduce((a, b) => a + b, 0);

                            let qtyRowsHtml = '';
                            sizeArray.forEach((val, idx) => {
                                qtyRowsHtml += `
                                    <div class="qty-box">
                                        ${!isClosed ? `<button class="danger" onclick="csRemoveQtyRow('${modelName}', '${colorName}', '${sizeId}', ${idx})"><i class="fas fa-minus"></i></button>` : ''}
                                        <input type="number" value="${val || ''}" min="0"
