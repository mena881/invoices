<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>نظام الجرد · Inventory</title>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
                   RESET & BASE
                   ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            background: #f6f8fc;
            min-height: 100vh;
            font-size: 15px;
            color: #0b1b2f;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e6edf5;
            border-radius: 12px;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c8cff;
            border-radius: 12px;
        }

        /* =========================================================
                   HEADER
                   ========================================================= */
        .header {
            background: #0b1b2f;
            color: #fff;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 4px 24px rgba(0, 20, 40, 0.12);
            position: sticky;
            top: 0;
            z-index: 120;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            color: #6c8cff;
            font-size: 1.4rem;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px 4px 6px;
            border-radius: 40px;
        }
        .user-info span {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d3deff;
        }
        .user-info span i {
            color: #6c8cff;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logout-btn:hover {
            background: #d14c4c;
            border-color: #d14c4c;
            transform: scale(1.02);
        }

        /* =========================================================
                   CONTAINER
                   ========================================================= */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px 80px;
        }

        /* =========================================================
                   STATS
                   ========================================================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #ffffff;
            padding: 22px 18px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 20, 40, 0.04);
            transition: all 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.02);
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.08);
        }
        .stat-icon {
            font-size: 28px;
            color: #6c8cff;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0b1b2f;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #6d7b93;
            font-weight: 500;
            margin-top: 2px;
        }

        /* =========================================================
                   SEARCH & FILTER
                   ========================================================= */
        .search-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0, 20, 40, 0.04);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .search-box input {
            flex: 1;
            padding: 10px 18px;
            border: 1px solid #e6edf5;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            min-width: 160px;
            transition: border-color 0.2s;
            background: #fafcff;
        }
        .search-box input:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }
        .search-box button {
            background: #6c8cff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box button:hover {
            background: #5a77e0;
            transform: scale(1.02);
        }

        /* =========================================================
                   INVENTORY LIST (Blank Receipts style)
                   ========================================================= */
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inventory-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(0, 20, 40, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .inventory-card:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.08);
            border-color: #6c8cff40;
        }
        .inventory-card.closed {
            opacity: 0.85;
            background: #f8faff;
            border-right: 5px solid #3dbb7a;
        }
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        .inventory-code {
            font-weight: 700;
            font-size: 1rem;
            color: #0b1b2f;
            background: #f0f4fe;
            padding: 4px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .inventory-code i {
            color: #6c8cff;
        }
        .inventory-badge {
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-open {
            background: #fef5e7;
            color: #b45b0a;
        }
        .badge-closed {
            background: #ddf4e8;
            color: #0e7b4a;
        }
        .inventory-details {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.85rem;
            color: #4e5e77;
        }
        .inventory-details span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .inventory-progress {
            margin-top: 14px;
        }
        .progress-bar {
            height: 6px;
            background: #e6edf5;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c8cff, #8b7bf7);
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        .progress-text {
            font-size: 0.75rem;
            color: #6d7b93;
            margin-top: 6px;
            text-align: left;
            font-weight: 500;
        }

        /* =========================================================
                   INVENTORY DETAIL (Blank Receipt Detail style)
                   ========================================================= */
        .inventory-detail {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 32px;
            margin-top: 24px;
            box-shadow: 0 8px 32px rgba(0, 20, 40, 0.08);
            display: none;
            animation: fadeSlide 0.25s ease;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f4fe;
        }
        .detail-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b1b2f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .close-detail {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #8a9bb0;
            padding: 4px 10px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .close-detail:hover {
            background: #f0f4fe;
            color: #0b1b2f;
        }
        .summary-bar {
            background: linear-gradient(135deg, #f0f4fe, #e8edfe);
            border-radius: 20px;
            padding: 18px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 16px;
            color: #0b1b2f;
            border: 1px solid rgba(108, 140, 255, 0.15);
        }
        .summary-item {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }
        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .summary-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #4e5e77;
            opacity: 0.8;
        }
        .info-row {
            background: #f8faff;
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 0.85rem;
            border: 1px solid #e6edf5;
        }
        .info-row span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-row strong {
            color: #0b1b2f;
        }

        /* =========================================================
                   MODELS GRID (inside detail)
                   ========================================================= */
        .models-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 24px;
        }
        .model-card {
            background: #fafcff;
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid #e6edf5;
            transition: border-color 0.2s;
            position: relative;
        }
        .model-card:hover {
            border-color: #6c8cff60;
        }
        .model-card.closed-model {
            background: #f6f9ff;
            opacity: 0.9;
            border-right: 5px solid #3dbb7a;
        }
        .model-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1f3a8a;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.2s;
        }
        .model-title:hover {
            color: #0b1b2f;
        }
        .model-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .model-title-left .toggle-icon {
            transition: transform 0.3s ease;
            display: inline-block;
            font-size: 1rem;
            color: #6c8cff;
            background: #e8edfe;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .model-title-left .toggle-icon.open {
            transform: rotate(180deg);
        }
        .model-title-left .toggle-icon i {
            font-size: 0.9rem;
        }
        .model-total-badge {
            background: #6c8cff;
            color: #fff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .model-location-badge {
            background: #f5a623;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .model-status {
            background: #e5eeff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1f3a8a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .model-type-badge {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .model-type-new {
            background: #fef5e7;
            color: #b45b0a;
        }
        .model-type-repeat {
            background: #e5eeff;
            color: #1f3a8a;
        }

        /* =========================================================
                   COLORS CONTAINER
                   ========================================================= */
        .colors-container {
            margin-bottom: 16px;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            padding: 16px 18px;
            background: #ffffff;
            transition: border-color 0.2s;
        }
        .colors-container:hover {
            border-color: #6c8cff40;
        }
        .color-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }
        .color-name-input {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .color-toggle-btn {
            background: #6c8cff;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .color-toggle-btn:hover {
            transform: scale(1.05);
        }
        .add-color-btn {
            background: #6c8cff;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
            font-weight: 600;
        }
        .add-color-btn:hover {
            background: #5a77e0;
        }
        .delete-color-btn {
            background: #e14c4c;
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .delete-color-btn:hover {
            background: #c03939;
            transform: scale(1.02);
        }

        .color-sizes-wrapper {
            display: none;
            margin-top: 12px;
            padding-right: 18px;
            border-right: 3px solid #6c8cff;
        }
        .color-sizes-wrapper.open {
            display: block;
        }
        .model-content-wrapper {
            display: none;
            margin-top: 14px;
        }
        .model-content-wrapper.open {
            display: block;
        }

        /* =========================================================
                   SIZES & QTY
                   ========================================================= */
        .sizes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .size-item {
            background: #f8faff;
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid #e6edf5;
        }
        .size-name {
            font-weight: 600;
            margin-bottom: 6px;
            color: #0b1b2f;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .qty-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .qty-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 14px;
        }
        .qty-box {
            background: #f8faff;
            border: 1px solid #e6edf5;
            border-radius: 30px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            transition: border-color 0.2s;
        }
        .qty-box:hover {
            border-color: #6c8cff60;
        }
        .qty-box input {
            width: 70px;
            border: none;
            text-align: center;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: transparent;
            font-weight: 600;
            padding: 4px 0;
            color: #0b1b2f;
        }
        .qty-box input:focus {
            outline: none;
        }
        .qty-box input:disabled {
            background: #e6edf5;
            color: #6d7b93;
            border-radius: 20px;
        }
        .qty-box input[value="0"] {
            color: transparent;
        }
        .qty-box input[value="0"]:focus {
            color: #0b1b2f;
        }
        .qty-box button {
            background: #6c8cff;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .qty-box button:hover {
            transform: scale(1.05);
        }
        .qty-box button.danger {
            background: #e14c4c;
        }
        .qty-box button.danger:hover {
            background: #c03939;
        }
        .qty-box button:disabled {
            background: #bcc8db;
            cursor: not-allowed;
            transform: none;
        }
        .total-received {
            font-size: 0.75rem;
            color: #1f3a8a;
            font-weight: 600;
            background: #e5eeff;
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* =========================================================
                   MODEL NOTE AREA
                   ========================================================= */
        .model-note-area {
            margin-top: 14px;
        }
        .model-note-area textarea {
            width: 100%;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid #e6edf5;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            resize: vertical;
            min-height: 50px;
            transition: border-color 0.2s;
            background: #ffffff;
            color: #0b1b2f;
        }
        .model-note-area textarea:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.15);
        }

        /* =========================================================
                   LOCATION INPUT
                   ========================================================= */
        .location-input-area {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .location-input-area label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #0b1b2f;
        }
        .location-input-area input {
            flex: 1;
            min-width: 120px;
            padding: 8px 14px;
            border: 1px solid #e6edf5;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            background: #fafcff;
            transition: border-color 0.2s;
        }
        .location-input-area input:focus {
            outline: none;
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.12);
        }
        .location-input-area input:disabled {
            background: #e6edf5;
            color: #6d7b93;
        }

        /* =========================================================
                   BUTTONS
                   ========================================================= */
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn-primary {
            background: #6c8cff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #5a77e0;
        }
        .btn-success {
            background: #3dbb7a;
            color: #fff;
        }
        .btn-success:hover {
            background: #2ea36a;
        }
        .btn-warning {
            background: #f5a623;
            color: #fff;
        }
        .btn-warning:hover {
            background: #d98e1a;
        }
        .btn-danger {
            background: #e14c4c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c03939;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        /* =========================================================
                   CREATE INVENTORY POPUP
                   ========================================================= */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 27, 47, 0.5);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;

    <!-- =========================================================

    <script>
        // ================================================================
        //  CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB7TgP9zI6LEc6yqfUyZqWYBqJyqL8oGxs",
            authDomain: "exams-fab0f.firebaseapp.com",
            databaseURL: "https://exams-fab0f-default-rtdb.firebaseio.com",
            projectId: "exams-fab0f",
            storageBucket: "exams-fab0f.firebasestorage.app",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abc123def456"
        };

        // ================================================================
        //  FIREBASE INIT
        // ================================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ================================================================
        //  GLOBAL STATE
        // ================================================================
        let currentUser = null;
        let currentInventoryId = null;
        let currentInventoryData = null;
        let allInventoryList = [];
        let allSizesList = [];
        let allModelsList = [];
        let allFactoriesList = [];
        let receivedModelsHistory = new Set();

        // UI state
        let modelOpenState = {};
        let colorOpenState = {};
        let inventoryPage = 0;
        const ITEMS_PER_PAGE = 100;

        // Auto-save
        let saveTimer = null;

        // Exclude tables
        const EXCLUDED_TABLES = ['currentTable', 'invoices'];

        // Pending model search
        let pendingModelSearchRowId = null;
        let inventoryPendingModelSearch = {};

        // ================================================================
        //  HELPERS
        // ================================================================
        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function getColorStateKey(inventoryId, modelName, colorName) {
            return `${inventoryId}_${modelName}_${colorName}`;
        }

        function getModelStateKey(inventoryId, modelName) {
            return `${inventoryId}_${modelName}`;
        }

        function showWarning(message, isError = false) {
            const indicator = document.getElementById('warningIndicator');
            indicator.innerText = message;
            indicator.className = isError ? 'warning-indicator error' : 'warning-indicator';
            indicator.style.display = 'flex';
            clearTimeout(window.warningTimeout);
            window.warningTimeout = setTimeout(() => { indicator.style.display = 'none'; }, 3000);
        }

        function showAutoSave(status, progress = '') {
            const indicator = document.getElementById('autoSaveIndicator');
            const statusText = document.getElementById('saveStatusText');
            const progressText = document.getElementById('saveProgressText');
            if (status === 'saving') {
                statusText.innerText = 'جاري الحفظ...';
                progressText.innerText = progress;
                indicator.style.display = 'flex';
            } else if (status === 'saved') {
                statusText.innerText = 'تم الحفظ ✓';
                progressText.innerText = '';
                indicator.style.display = 'flex';
                clearTimeout(window.autoSaveTimeout);
                window.autoSaveTimeout = setTimeout(() => {
                    indicator.style.display = 'none';
                }, 1500);
            } else {
                indicator.style.display = 'none';
            }
        }

        function scheduleSave() {
            clearTimeout(saveTimer);
            showAutoSave('saving', '...');
            saveTimer = setTimeout(() => {
                showAutoSave('saved', '');
            }, 1000);
        }

        // ================================================================
        //  AUTHENTICATION
        // ================================================================
        function checkAuth() {
            const user = localStorage.getItem('currentUser');
            if (!user) { window.location.href = 'index.html'; return; }
            try {
                currentUser = JSON.parse(user);
                if (!currentUser.userId && !currentUser.uid) {
                    db.ref('users').once('value').then((snapshot) => {
                        snapshot.forEach((child) => {
                            const userData = child.val();
                            if (userData.username === currentUser.username) {
                                currentUser.userId = child.key;
                                currentUser.uid = child.key;
                                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                            }
                        });
                    });
                }
                if (currentUser.role !== 'employee') { window.location.href = 'admin-dashboard.html'; return; }
                document.getElementById('userName').innerText = currentUser.fullName || currentUser.username;
                Promise.all([loadSizes(), loadAllModels(), loadAllFactories(), loadReceivedModelsHistory()])
                    .then(() => {
                        loadInventory();
                        loadDashboardStats();
                        loadInventoryFormData();
                        setupModalListeners();
                    });
            } catch (e) {
                console.error('Auth error:', e);
                window.location.href = 'index.html';
            }
        }

        // ================================================================
        //  DATA LOADING
        // ================================================================
        async function loadSizes() {
            const snapshot = await db.ref('sizes').once('value');
            allSizesList = [];
            snapshot.forEach(child => {
                allSizesList.push({ id: child.key, name: child.val().name.trim() });
            });
            allSizesList.sort((a, b) => {
                const order = ['S', 'M', 'L', 'XL', '2XL', '3XL', '4XL', '5XL', '6XL'];
                return order.indexOf(a.name) - order.indexOf(b.name);
            });
        }

        async function loadAllModels() {
            const snapshot = await db.ref('models').once('value');
            allModelsList = [];
            snapshot.forEach(child => {
                if (EXCLUDED_TABLES.includes(child.key)) return;
                allModelsList.push({
                    id: child.key,
                    name: child.val().name,
                    code: child.val().code || '',
                    factory: child.val().factory,
                    imageUrl: child.val().imageUrl || ''
                });
            });
        }

        async function loadAllFactories() {
            const snapshot = await db.ref('factories').once('value');
            allFactoriesList = [];
            snapshot.forEach(child => {
                if (EXCLUDED_TABLES.includes(child.key)) return;
                allFactoriesList.push({ id: child.key, name: child.val().name });
            });
        }

        async function loadReceivedModelsHistory() {
            receivedModelsHistory.clear();
            const snapshot = await db.ref('inventory').once('value');
            snapshot.forEach((child) => {
                const inv = child.val();
                if (inv.modelColors) {
                    Object.keys(inv.modelColors).forEach(modelName => {
                        receivedModelsHistory.add(modelName);
                    });
                }
            });
            // Also check normal receipts for history
            const receiptSnapshot = await db.ref('receipts').once('value');
            receiptSnapshot.forEach((child) => {
                const receipt = child.val();
                if (receipt.models) {
                    receipt.models.forEach(model => {
                        if (model.modelName) receivedModelsHistory.add(model.modelName);
                        if (model.modelCode) receivedModelsHistory.add(model.modelCode);
                    });
                }
            });
        }

        // ================================================================
        //  INVENTORY LOADING & RENDERING
        // ================================================================
        async function loadInventory() {
            const snapshot = await db.ref('inventory').once('value');
            const inventory = [];
            const userId = currentUser.userId || currentUser.uid || currentUser.username || '';

            snapshot.forEach((child) => {
                const inv = child.val();
                if (inv.assignedEmployeesUsernames && inv.assignedEmployeesUsernames.includes(currentUser.username)) {
                    inventory.push({ id: child.key, ...inv });
                }
            });

            // Sort by createdAt descending
            inventory.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            allInventoryList = inventory;
            inventoryPage = 0;
            renderInventoryList(inventory.slice(0, ITEMS_PER_PAGE));
            updateLoadMoreBtn(inventory.length);
            loadDashboardStats();
        }

        function renderInventoryList(items) {
            const container = document.getElementById('inventoryList');
            if (items.length === 0 && inventoryPage === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>لا توجد فواتير جرد - أنشئ فاتورة جديدة</p>
                    </div>
                `;
                return;
            }
            if (items.length === 0 && inventoryPage > 0) {
                return;
            }
            if (inventoryPage === 0) {
                container.innerHTML = '';
            }

            items.forEach(inv => {
                let totalItems = 0;
                let totalQty = 0;
                if (inv.modelColors) {
                    for (const modelName in inv.modelColors) {
                        totalItems++;
                        for (const colorName in inv.modelColors[modelName]) {
                            for (const sizeId in inv.modelColors[modelName][colorName]) {
                                const sizeArray = inv.modelColors[modelName][colorName][sizeId] || [0];
                                totalQty += sizeArray.reduce((a, b) => a + b, 0);
                            }
                        }
                    }
                }

                const isClosed = inv.isClosed === true;

                container.innerHTML += `
                    <div class="inventory-card ${isClosed ? 'closed' : ''}" onclick="openInventory('${inv.id}')">
                        <div class="inventory-header">
                            <span class="inventory-code"><i class="fas fa-barcode"></i> ${inv.invoiceCode}</span>
                            <span class="inventory-badge ${isClosed ? 'badge-closed' : 'badge-open'}">${isClosed ? 'مقفلة' : 'مفتوحة'}</span>
                        </div>
                        <div class="inventory-details">
                            <span><i class="fas fa-factory"></i> ${inv.factory || '-'}</span>
                            <span><i class="fas fa-tags"></i> ${totalItems} موديل</span>
                            <span><i class="fas fa-boxes"></i> ${totalQty} قطعة</span>
                        </div>
                        <div class="inventory-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${isClosed ? 100 : Math.min(totalItems > 0 ? 50 : 0, 100)}%"></div>
                            </div>
                            <div class="progress-text">${isClosed ? '✅ مقفلة' : 'جاري الجرد...'}</div>
                        </div>
                    </div>
                `;
            });
        }

        function updateLoadMoreBtn(totalItems) {
            const btn = document.getElementById('loadMoreInventoryBtn');
            if (totalItems <= (inventoryPage + 1) * ITEMS_PER_PAGE) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'flex';
            }
        }

        function loadMoreInventory() {
            inventoryPage++;
            const start = inventoryPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const chunk = allInventoryList.slice(start, end);
            if (chunk.length > 0) {
                renderInventoryList(chunk);
                updateLoadMoreBtn(allInventoryList.length);
            }
        }

        function filterInventory() {
            const searchTerm = document.getElementById('inventorySearch').value.toLowerCase();
            const filtered = allInventoryList.filter(item =>
                item.invoiceCode.toLowerCase().includes(searchTerm) ||
                (item.modelColors && Object.keys(item.modelColors).some(m => m.toLowerCase().includes(searchTerm)))
            );
            inventoryPage = 0;
            renderInventoryList(filtered.slice(0, ITEMS_PER_PAGE));
            updateLoadMoreBtn(filtered.length);
            window._filteredInventory = filtered;
        }

        // ================================================================
        //  DASHBOARD STATS
        // ================================================================
        async function loadDashboardStats() {
            let totalInventory = 0;
            let totalItems = 0;
            let totalQuantity = 0;
            let pending = 0;

            const snapshot = await db.ref('inventory').once('value');
            snapshot.forEach((child) => {
                const inv = child.val();
                if (inv.assignedEmployeesUsernames && inv.assignedEmployeesUsernames.includes(currentUser.username)) {
                    totalInventory++;
                    if (!inv.isClosed) pending++;

                    if (inv.modelColors) {
                        for (const modelName in inv.modelColors) {
                            totalItems++;
                            for (const colorName in inv.modelColors[modelName]) {
                                for (const sizeId in inv.modelColors[modelName][colorName]) {
                                    const sizeArray = inv.modelColors[modelName][colorName][sizeId] || [0];
                                    totalQuantity += sizeArray.reduce((a, b) => a + b, 0);
                                }
                            }
                        }
                    }
                }
            });

            document.getElementById('totalInventory').innerText = totalInventory;
            document.getElementById('totalItems').innerText = totalItems;
            document.getElementById('totalQuantity').innerText = totalQuantity;
            document.getElementById('pendingCount').innerText = pending;
        }

        // ================================================================
        //  INVENTORY - OPEN / CLOSE / RENDER
        // ================================================================
        function closeInventoryDetail(silent = false) {
            document.getElementById('inventoryDetail').style.display = 'none';
            if (currentInventoryId) {
                delete modelOpenState[currentInventoryId];
                delete colorOpenState[currentInventoryId];
            }
            currentInventoryId = null;
            currentInventoryData = null;
        }

        async function openInventory(inventoryId) {
            if (currentInventoryId && currentInventoryData) { closeInventoryDetail(true); }

            currentInventoryId = inventoryId;
            const snapshot = await db.ref(`inventory/${inventoryId}`).once('value');
            currentInventoryData = snapshot.val();
            if (!currentInventoryData) { showWarning('حدث خطأ في تحميل الفاتورة', true); return; }

            if (!currentInventoryData.modelColors) currentInventoryData.modelColors = {};
            if (!currentInventoryData.modelNotes) currentInventoryData.modelNotes = {};
            if (!currentInventoryData.modelLocations) currentInventoryData.modelLocations = {};

            if (!modelOpenState[inventoryId]) modelOpenState[inventoryId] = {};
            if (!colorOpenState[inventoryId]) colorOpenState[inventoryId] = {};

            renderInventoryDetail();
            setTimeout(() => {
                document.getElementById('inventoryDetail').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        // ================================================================
        //  CALCULATIONS
        // ================================================================
        function calculateTotalForColor(invData, modelName, colorName) {
            let total = 0;
            const colorData = invData?.modelColors?.[modelName]?.[colorName] || {};
            for (const sizeId in colorData) {
                const sizeArray = colorData[sizeId] || [0];
                total += sizeArray.reduce((a, b) => a + b, 0);
            }
            return total;
        }

        function calculateTotalForModel(invData, modelName) {
            let total = 0;
            const modelColors = invData?.modelColors?.[modelName] || {};
            for (const colorName in modelColors) {
                total += calculateTotalForColor(invData, modelName, colorName);
            }
            return total;
        }

        // ================================================================
        //  UI ACTIONS WITH AUTO-SAVE
        // ================================================================
        function handleQtyChange(modelName, colorName, sizeId, index, value) {
            if (!currentInventoryId || !currentInventoryData) return;
            if (currentInventoryData.isClosed) return;

            const numValue = parseInt(value) || 0;
            if (numValue < 0) return;

            // Update UI immediately
            const colorData = currentInventoryData.modelColors?.[modelName]?.[colorName];
            if (colorData && colorData[sizeId]) {
                colorData[sizeId][index] = numValue;
            }

            // Save with delay
            updateQty(currentInventoryId, modelName, colorName, sizeId, index, numValue)
                .then(() => scheduleSave())
                .catch(err => {
                    console.error('Error updating qty:', err);
                    showWarning('حدث خطأ في حفظ الكمية', true);
                });

            // Re-render to update totals
            renderInventoryDetail();
        }

        async function updateQty(inventoryId, modelName, colorName, sizeId, index, value) {
            const path = `inventory/${inventoryId}/modelColors/${modelName}/${colorName}/${sizeId}/${index}`;
            await db.ref(path).set(value);
            await db.ref(`inventory/${inventoryId}/updatedAt`).set(Date.now());
        }

        function addNewQtyRow(modelName, colorName, sizeId) {
            if (!currentInventoryId || !currentInventoryData) return;
            if (currentInventoryData.isClosed) return;

            addQtyRow(currentInventoryId, modelName, colorName, sizeId)
                .then(() => {
                    renderInventoryDetail();
                    scheduleSave();
                })
                .catch(err => {
                    console.error('Error adding qty row:', err);
                    showWarning('حدث خطأ في إضافة الصف', true);
                });
        }

        async function addQtyRow(inventoryId, modelName, colorName, sizeId) {
            const path = `inventory/${inventoryId}/modelColors/${modelName}/${colorName}/${sizeId}`;
            const snapshot = await db.ref(path).once('value');
            let currentArray = snapshot.val() || [0];
            currentArray.push(0);
            await db.ref(path).set(currentArray);
            await db.ref(`inventory/${inventoryId}/updatedAt`).set(Date.now());
        }

        function removeColorSizeRow(modelName, colorName, sizeId, index) {
            if (!currentInventoryId || !currentInventoryData) return;
            if (currentInventoryData.isClosed) return;

            const colorData = currentInventoryData.modelColors?.[modelName]?.[colorName];
            if (!colorData) return;

            const currentValue = colorData[sizeId]?.[index] || 0;

            if (currentValue === 0 || colorData[sizeId]?.length === 1) {
                removeQtyRow(currentInventoryId, modelName, colorName, sizeId, index)
                    .then(() => {
                        renderInventoryDetail();
                        scheduleSave();
                    })
                    .catch(err => {
                        console.error('Error removing qty row:', err);
                        showWarning('حدث خطأ في حذف الصف', true);
                    });
            } else {
                customConfirm(`هل أنت متأكد من حذف الكمية (${currentValue})؟`, async (confirmed) => {
                    if (confirmed) {
                        await removeQtyRow(currentInventoryId, modelName, colorName, sizeId, index);
                        renderInventoryDetail();
                        scheduleSave();
                    }
                });
            }
        }

        async function removeQtyRow(inventoryId, modelName, colorName, sizeId, index) {
            const path = `inventory/${inventoryId}/modelColors/${modelName}/${colorName}/${sizeId}`;
            const snapshot = await db.ref(path).once('value');
            let currentArray = snapshot.val() || [0];
            currentArray.splice(index, 1);
            if (currentArray.length === 0) currentArray = [0];
            await db.ref(path).set(currentArray);
            await db.ref(`inventory/${inventoryId}/updatedAt`).set(Date.now());
        }

        function addNewColor(modelName) {
            if (!currentInventoryId || !currentInventoryData) return;
            if (currentInventoryData.isClosed) return;

            customPrompt('أدخل اسم اللون الجديد:', 'مثال: أحمر', async (newColorName) => {
                if (!newColorName) return;

                if (currentInventoryData.modelColors?.[modelName]?.[newColorName]) {
                    showWarning('هذا اللون موجود بالفعل', true);
                    return;

        async function updateModelName(inventoryId, oldName, newName) {
            const path = `inventory/${inventoryId}`;
            const snapshot = await db.ref(path).once('value');
            const data = snapshot.val();
            if (!data) return { success: false };

            if (data.modelColors && data.modelColors[oldName]) {
                data.modelColors[newName] = data.modelColors[oldName];
                delete data.modelColors[oldName];
            }
            if (data.modelNotes && data.modelNotes[oldName]) {
                data.modelNotes[newName] = data.modelNotes[oldName];
                delete data.modelNotes[oldName];
            }
            if (data.modelLocations && data.modelLocations[oldName]) {
                data.modelLocations[newName] = data.modelLocations[oldName];
                delete data.modelLocations[oldName];
            }
            if (data.closedModels && data.closedModels[oldName]) {
                data.closedModels[newName] = data.closedModels[oldName];
                delete data.closedModels[oldName];
            }
            if (data.closedModelsDate && data.closedModelsDate[oldName]) {
                data.closedModelsDate[newName] = data.closedModelsDate[oldName];
                delete data.closedModelsDate[oldName];
            }

            await db.ref(path).set(data);
            await db.ref(`inventory/${inventoryId}/updatedAt`).set(Date.now());

            if (currentInventoryData) {
                if (currentInventoryData.modelColors && currentInventoryData.modelColors[oldName]) {
                    currentInventoryData.modelColors[newName] = currentInventoryData.modelColors[oldName];
                    delete currentInventoryData.modelColors[oldName];
                }
                if (currentInventoryData.modelNotes && currentInventoryData.modelNotes[oldName]) {
                    currentInventoryData.modelNotes[newName] = currentInventoryData.modelNotes[oldName];
                    delete currentInventoryData.modelNotes[oldName];
                }
                if (currentInventoryData.modelLocations && currentInventoryData.modelLocations[oldName]) {
                    currentInventoryData.modelLocations[newName] = currentInventoryData.modelLocations[oldName];
                    delete currentInventoryData.modelLocations[oldName];
                }
                if (currentInventoryData.closedModels && currentInventoryData.closedModels[oldName]) {
                    currentInventoryData.closedModels[newName] = currentInventoryData.closedModels[oldName];
                    delete currentInventoryData.closedModels[oldName];
                }
                if (currentInventoryData.closedModelsDate && currentInventoryData.closedModelsDate[oldName]) {
                    currentInventoryData.closedModelsDate[newName] = currentInventoryData.closedModelsDate[oldName];
                    delete currentInventoryData.closedModelsDate[oldName];
                }
            }

            return { success: true };
        }

            const resultsDiv = document.getElementById(`inventoryModelSearchResults_${rowId}`);
            const currentFactory = currentInventoryData?.factory || '';

            if (!searchTerm.trim()) { resultsDiv.style.display = 'none'; return; }

            const filteredModels = allModelsList.filter(m =>
                (currentFactory ? m.factory === currentFactory : true) &&
                (m.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (m.code && m.code.toLowerCase().includes(searchTerm.toLowerCase())))
            );

            if (filteredModels.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="model-search-result" onclick="openAddModelFromInventorySearch('${searchTerm.replace(/'/g, "\\'")}', ${rowId})">
                        <i class="fas fa-plus-circle"></i> إضافة موديل جديد: "${searchTerm}"
                    </div>`;
                resultsDiv.style.display = 'block';
            } else {
                resultsDiv.innerHTML = filteredModels.map(m => {
                    const isNewModel = !receivedModelsHistory.has(m.name) && !receivedModelsHistory.has(m
                    .code);
                    const badge = isNewModel ?
                        '<span class="model-smart-badge badge-new" style="margin-right:8px;"><i class="fas fa-camera"></i> جديد</span>' :
                        '<span class="model-smart-badge badge-repeat" style="margin-right:8px;">مكرر</span>';
                    return `

            inventoryPendingModelSearch[rowId] = true;

        async function quickAddModel() {
            const currentFactory = currentInventoryData?.factory || '';
            if (!currentFactory) {
                document.getElementById('modelErrorMsg').innerHTML = 'الرجاء اختيار المصنع أولاً';
                return;
            }
            const modelCode = document.getElementById('newModelCode').value.trim();
            if (!modelCode) {
                document.getElementById('modelErrorMsg').innerHTML = 'الرجاء إدخال كود الموديل';
                return;
            }

            // Check if model code already exists in same factory
            const exists = allModelsList.some(m => (m.code === modelCode || m.name === modelCode) && m.factory ===
                currentFactory);
            if (exists) {
                document.getElementById('modelErrorMsg').innerHTML = 'هذا الموديل موجود بالفعل في هذا المصنع';
                return;
            }

            // Generate unique code if needed
            let finalCode = modelCode;
            const codeExists = allModelsList.some(m => m.code === modelCode || m.name === modelCode);
            if (codeExists) {
                let counter = 1;
                let newCode = `${modelCode}-${counter}`;
                while (allModelsList.some(m => m.code === newCode || m.name === newCode)) {
                    counter++;
                    newCode = `${modelCode}-${counter}`;
                }
                finalCode = newCode;
            }

            const newModelData = { name: finalCode, code: finalCode, factory: currentFactory };
            const newRef = await db.ref('models').push(newModelData);
            await loadAllModels();
            await loadReceivedModelsHistory();
            const newModel = { id: newRef.key, name: finalCode, code: finalCode, factory: currentFactory, imageUrl: '' };
            allModelsList.push(newModel);

            // Find the pending row
            let rowId = null;
            for (const key in inventoryPendingModelSearch) {
                if (inventoryPendingModelSearch[key] === true) {
                    rowId = parseInt(key);
                    break;
                }
            }

            if (rowId) {
                document.getElementById(`inventorySelectedModel_${rowId}`).value = finalCode;
                const input = document.querySelector(`#inventory-model-row-${rowId} .model-search-input`);
                if (input) input.value = finalCode;
                document.getElementById(`inventoryModelSearchResults_${rowId}`).style.display = 'none';
                confirmAddInventoryModel(rowId);
            } else {
                if (currentInventoryData && !currentInventoryData.modelColors[finalCode]) {
                    await addModelToInventory(currentInventoryId, finalCode);
                    renderInventoryDetail();
                    scheduleSave();
                }
            }

            document.getElementById('newModelCode').value = '';
            closeModelModal();
            showWarning('تم إضافة الموديل بنجاح', false);
        }

        function cancelAddInventoryModel(rowId) {
            const row = document.getElementById(`inventory-model-row-${rowId}`);
            if (row) row.remove();
            delete inventoryPendingModelSearch[rowId];

            const modelName = document.getElementById(`inventorySelectedModel_${rowId}`).value;

            }

            const row = document.getElementById(`inventory-model-row-${rowId}`);

            delete inventoryPendingModelSearch[rowId];

            if (currentInventoryData.modelColors[modelName]) {

                return;

            await addModelToInventory(currentInventoryId, modelName);
            renderInventoryDetail();
            scheduleSave();
            showWarning(`تم إضافة الموديل ${modelName}`, false);
        }

        async function addModelToInventory(inventoryId, modelName) {

            await db.ref(`inventory/${inventoryId}/modelNotes/${modelName}`).set('');
            await db.ref(`inventory/${inventoryId}/modelLocations/${modelName}`).set('');
            await db.ref(`inventory/${inventoryId}/updatedAt`).set(Date.now());

            if (currentInventoryData) {
                currentInventoryData.modelColors[modelName] = {};
                if (!currentInventoryData.modelNotes) currentInventoryData.modelNotes = {};
                currentInventoryData.modelNotes[modelName] = '';
                if (!currentInventoryData.modelLocations) currentInventoryData.modelLocations = {};
                currentInventoryData.modelLocations[modelName] = '';
            }
        }

                const isClosed = currentInventoryData.closedModels?.[modelName] === true;
                summaryHtml += `
                    <div class="close-summary-item">
                        <span><strong>${modelName}</strong> ${isClosed ? '✅ مقفل' : ''}</span>
                        <span>${modelTotal} قطعة</span>
                    </div>
                `;
            }

            if (totalItems === 0) {
                summaryHtml =
                `<div class="close-summary-item"><span>⚠️ لم يتم استلام أي كميات في هذه الفاتورة</span></div>`;
            }

            document.getElementById('closeSummary').innerHTML = summaryHtml;

            const warningDiv = document.querySelector('#confirmCloseModal .close-warning');
            if (totalItems === 0) {
                warningDiv.innerHTML =
                    `<i class="fas fa-exclamation-triangle"></i> تحذير: لم يتم استلام أي كميات في هذه الفاتورة. هل أنت متأكد من إقفالها؟`;
                warningDiv.style.display = 'block';
                warningDiv.style.backgroundColor = '#fef5f5';
                warningDiv.style.borderColor = '#fce4e4';
            } else {
                warningDiv.innerHTML =
                    `<i class="fas fa-check-circle"></i> تم استلام ${totalQty} قطعة في ${totalItems} موديل. هل تريد إقفال الجرد؟`;
                warningDiv.style.backgroundColor = '#ddf4e8';
                warningDiv.style.borderColor = '#b8e6d4';
            }

            document.getElementById('confirmCloseModal').style.display = 'flex';
        }

        function closeConfirmCloseModal() {
            document.getElementById('confirmCloseModal').style.display = 'none';
        }

        function confirmCloseInventory() {
            closeConfirmCloseModal();
            if (!currentInventoryId || !currentInventoryData) return;

            performCloseInventory(currentInventoryId)
                .then(() => {
                    showWarning('✅ تم إقفال الجرد بنجاح', false);
                    closeInventoryDetail(true);
                    loadInventory();
                    loadDashboardStats();
                })
                .catch(err => {
                    console.error('Error closing inventory:', err);
                    showWarning('حدث خطأ في إقفال الجرد', true);
                });
        }

        async function performCloseInventory(inventoryId) {
            // Close all open models
            for (const modelName in currentInventoryData.modelColors || {}) {
                if (currentInventoryData.closedModels?.[modelName] !== true) {
                    await db.ref(`inventory/${inventoryId}/closedModels/${modelName}`).set(true);
                    await db.ref(`inventory/${inventoryId}/closedModelsDate/${modelName}`).set(new Date().toISOString());
                }
            }

            await db.ref(`inventory/${inventoryId}/isClosed`).set(true);
            await db.ref(`inventory/${inventoryId}/closedDate`).set(new Date().toISOString());
            await db.ref(`inventory/${inventoryId}/updatedAt`).set(Date.now());

            // Update received models history
            await loadReceivedModelsHistory();
        }

        // ================================================================
        //  FACTORY QUICK ADD
        // ================================================================
        function openFactoryModal() {
            document.getElementById('factoryModal').style.display = 'flex';
            document.getElementById('quickFactoryName').value = '';
            document.getElementById('factoryErrorMsg').innerHTML = '';
        }

        function closeFactoryModal() { document.getElementById('factoryModal').style.display = 'none'; }

        async function quickAddFactory() {
            const name = document.getElementById('quickFactoryName').value.trim();
            if (!name) { document.getElementById('factoryErrorMsg').innerHTML = 'الرجاء إدخال اسم المصنع'; return; }

            const snapshot = await db.ref('factories').once('value');
            let exists = false;
            snapshot.forEach(child => { if (child.val().name === name) exists = true; });
            if (exists) { document.getElementById('factoryErrorMsg').innerHTML = 'هذا المصنع موجود بالفعل'; return; }

            await db.ref('factories').push({ name });
            await loadAllFactories();
            closeFactoryModal();
            loadInventoryFormData();
            showWarning('تم إضافة المصنع بنجاح', false);
        }

        // ================================================================
        //  MODAL HELPERS
        // ================================================================
        let modalEventListenersAdded = false;

        function setupModalListeners() {
            if (modalEventListenersAdded) return;
            modalEventListenersAdded = true;

            const modal = document.getElementById('customModal');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            cancelBtn.addEventListener('click', function() { modal.style.display = 'none'; });
            modal.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.style.display === 'flex') modal.style.display = 'none';
            });
        }

        function customConfirm(message, callback) {
            setupModalListeners();
            const modal = document.getElementById('customModal');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMessage');
            const inputField = document.getElementById('modalInput');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            title.innerText = 'تأكيد';
            msg.innerText = message;
            inputField.style.display = 'none';
            modal.style.display = 'flex';

            const onConfirm = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(true);
            };
            const onCancel = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(false);
            };

            confirmBtn.addEventListener('click', onConfirm);
            cancelBtn.addEventListener('click', onCancel);
        }

        function customPrompt(message, placeholder, callback) {
            setupModalListeners();
            const modal = document.getElementById('customModal');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMessage');
            const inputField = document.getElementById('modalInput');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            title.innerText = 'إدخال';
            msg.innerText = message;
            inputField.style.display = 'block';
            inputField.placeholder = placeholder || '';
            inputField.value = '';
            modal.style.display = 'flex';

            const onConfirm = () => {
                const value = inputField.value;
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(value);
            };
            const onCancel = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(null);
            };

            confirmBtn.addEventListener('click', onConfirm);
            cancelBtn.addEventListener('click', onCancel);
        }

        // ================================================================
        //  LOGOUT
        // ================================================================
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ================================================================
        //  STARTUP
        // ================================================================
        checkAuth();

        console.log('📌 حفظ تلقائي بعد التعديل');
        console.log('📌 إقفال الموديلات والفاتورة بالكامل');
        console.log('📌 فتح وقفل أنيق للمنتجات والألوان');
        console.log('📌 أزرار فتح/غلق الكل للمنتجات والألوان');

    </script>
