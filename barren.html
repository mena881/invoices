        // ================================================================
        //  TAB 1: COLORS & SIZES - UI ACTIONS
        // ================================================================
        function calculateTotalForColor(invData, modelName, colorName) {
            let total = 0;
            const colorData = invData?.modelColors?.[modelName]?.[colorName] || {};
            for (const sizeId in colorData) {
                const sizeArray = colorData[sizeId] || [0];
                total += sizeArray.reduce((a, b) => a + b, 0);
            }
            return total;
        }

        function calculateTotalForModel(invData, modelName) {
            let total = 0;
            const modelColors = invData?.modelColors?.[modelName] || {};
            for (const colorName in modelColors) {
                total += calculateTotalForColor(invData, modelName, colorName);
            }
            return total;
        }

        // Qty changes
        function csHandleQtyChange(modelName, colorName, sizeId, index, value) {
            if (!csCurrentId || !csCurrentData || csCurrentData.isClosed) return;
            const numValue = parseInt(value) || 0;
            if (numValue < 0) return;

            const colorData = csCurrentData.modelColors?.[modelName]?.[colorName];
            if (colorData && colorData[sizeId]) {
                colorData[sizeId][index] = numValue;
            }

            csUpdateQty(csCurrentId, modelName, colorName, sizeId, index, numValue)
                .then(() => scheduleSave())
                .catch(err => {
                    console.error('Error updating qty:', err);
                    showWarning('حدث خطأ في حفظ الكمية', true);
                });
            renderColorsSizesDetail();
        }

        async function csUpdateQty(id, modelName, colorName, sizeId, index, value) {
            const path = `inventory/${id}/modelColors/${modelName}/${colorName}/${sizeId}/${index}`;
            await db.ref(path).set(value);
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
        }

        function csAddQtyRow(modelName, colorName, sizeId) {
            if (!csCurrentId || !csCurrentData || csCurrentData.isClosed) return;
            csAddQtyRowDB(csCurrentId, modelName, colorName, sizeId)
                .then(() => {
                    renderColorsSizesDetail();
                    scheduleSave();
                })
                .catch(err => {
                    console.error('Error adding qty row:', err);
                    showWarning('حدث خطأ في إضافة الصف', true);
                });
        }

        async function csAddQtyRowDB(id, modelName, colorName, sizeId) {
            const path = `inventory/${id}/modelColors/${modelName}/${colorName}/${sizeId}`;
            const snapshot = await db.ref(path).once('value');
            let currentArray = snapshot.val() || [0];
            currentArray.push(0);
            await db.ref(path).set(currentArray);
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
        }

        function csRemoveQtyRow(modelName, colorName, sizeId, index) {
            if (!csCurrentId || !csCurrentData || csCurrentData.isClosed) return;
            const colorData = csCurrentData.modelColors?.[modelName]?.[colorName];
            if (!colorData) return;

            const currentValue = colorData[sizeId]?.[index] || 0;

            if (currentValue === 0 || colorData[sizeId]?.length === 1) {
                csRemoveQtyRowDB(csCurrentId, modelName, colorName, sizeId, index)
                    .then(() => {
                        renderColorsSizesDetail();
                        scheduleSave();
                    })
                    .catch(err => {
                        console.error('Error removing qty row:', err);
                        showWarning('حدث خطأ في حذف الصف', true);
                    });
            } else {
                customConfirm(`هل أنت متأكد من حذف الكمية (${currentValue})؟`, async (confirmed) => {
                    if (confirmed) {
                        await csRemoveQtyRowDB(csCurrentId, modelName, colorName, sizeId, index);
                        renderColorsSizesDetail();
                        scheduleSave();
                    }
                });
            }
        }

        async function csRemoveQtyRowDB(id, modelName, colorName, sizeId, index) {
            const path = `inventory/${id}/modelColors/${modelName}/${colorName}/${sizeId}`;
            const snapshot = await db.ref(path).once('value');
            let currentArray = snapshot.val() || [0];
            currentArray.splice(index, 1);
            if (currentArray.length === 0) currentArray = [0];
            await db.ref(path).set(currentArray);
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
        }

        // Colors
        function csAddColor(modelName) {

            customPrompt('أدخل اسم اللون الجديد:', 'مثال: أحمر', async (newColorName) => {
                if (!newColorName) return;
                if (csCurrentData.modelColors?.[modelName]?.[newColorName]) {
                    showWarning('هذا اللون موجود بالفعل', true);

                renderColorsSizesDetail();
                scheduleSave();
                showWarning(`تم إضافة اللون ${newColorName}`, false);
            });

        async function csAddColorDB(id, modelName, colorName) {
            const path = `inventory/${id}/modelColors/${modelName}/${colorName}`;
            const colorData = {};
            allSizesList.forEach(({ id: sizeId }) => {
                colorData[sizeId] = [0];
            });
            await db.ref(path).set(colorData);
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
            if (csCurrentData) {
                if (!csCurrentData.modelColors[modelName]) csCurrentData.modelColors[modelName] = {};
                csCurrentData.modelColors[modelName][colorName] = colorData;
            }
        }

                if (confirmed) {

        async function csDeleteColorDB(id, modelName, colorName) {
            await db.ref(`inventory/${id}/modelColors/${modelName}/${colorName}`).remove();
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
            if (csCurrentData) {
                delete csCurrentData.modelColors[modelName][colorName];
                if (Object.keys(csCurrentData.modelColors[modelName]).length === 0) {
                    delete csCurrentData.modelColors[modelName];

        // Edit inline
        function csEditModelName(oldName) {
            if (!csCurrentId || !csCurrentData || csCurrentData.isClosed) {
                showWarning('لا يمكن تعديل الموديل في فاتورة مقفلة', true);
                return;
            }
            customPrompt('أدخل الاسم الجديد للموديل:', oldName, async (newName) => {
                if (!newName || newName.trim() === '' || newName === oldName) return;
                const result = await csUpdateModelName(csCurrentId, oldName, newName);
                if (result.success) {
                    showWarning('تم تحديث اسم الموديل بنجاح', false);
                    renderColorsSizesDetail();
                    scheduleSave();
                } else {
                    showWarning(result.error || 'حدث خطأ', true);
                }
            });
        }

        async function csUpdateModelName(id, oldName, newName) {
            const path = `inventory/${id}`;
            const snapshot = await db.ref(path).once('value');
            const data = snapshot.val();
            if (!data) return { success: false };

            if (data.modelColors && data.modelColors[oldName]) {
                data.modelColors[newName] = data.modelColors[oldName];
                delete data.modelColors[oldName];
            }
            if (data.modelNotes && data.modelNotes[oldName]) {
                data.modelNotes[newName] = data.modelNotes[oldName];
                delete data.modelNotes[oldName];
            }
            if (data.modelLocations && data.modelLocations[oldName]) {
                data.modelLocations[newName] = data.modelLocations[oldName];
                delete data.modelLocations[oldName];
            }
            if (data.closedModels && data.closedModels[oldName]) {
                data.closedModels[newName] = data.closedModels[oldName];
                delete data.closedModels[oldName];
            }
            if (data.closedModelsDate && data.closedModelsDate[oldName]) {
                data.closedModelsDate[newName] = data.closedModelsDate[oldName];
                delete data.closedModelsDate[oldName];
            }

            await db.ref(path).set(data);
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());

            if (csCurrentData) {
                if (csCurrentData.modelColors && csCurrentData.modelColors[oldName]) {
                    csCurrentData.modelColors[newName] = csCurrentData.modelColors[oldName];
                    delete csCurrentData.modelColors[oldName];
                }
                if (csCurrentData.modelNotes && csCurrentData.modelNotes[oldName]) {
                    csCurrentData.modelNotes[newName] = csCurrentData.modelNotes[oldName];
                    delete csCurrentData.modelNotes[oldName];
                }
                if (csCurrentData.modelLocations && csCurrentData.modelLocations[oldName]) {
                    csCurrentData.modelLocations[newName] = csCurrentData.modelLocations[oldName];
                    delete csCurrentData.modelLocations[oldName];
                }
                if (csCurrentData.closedModels && csCurrentData.closedModels[oldName]) {
                    csCurrentData.closedModels[newName] = csCurrentData.closedModels[oldName];
                    delete csCurrentData.closedModels[oldName];
                }
                if (csCurrentData.closedModelsDate && csCurrentData.closedModelsDate[oldName]) {
                    csCurrentData.closedModelsDate[newName] = csCurrentData.closedModelsDate[oldName];
                    delete csCurrentData.closedModelsDate[oldName];
                }
            }

            return { success: true };
        }

            if (data.modelColors && data.modelColors[modelName] && data.modelColors[modelName][oldColor]) {

            return { success: true };

        async function quickAddModel() {
            const currentFactory = csCurrentData?.factory || '';
            if (!currentFactory) {
                document.getElementById('modelErrorMsg').innerHTML = 'الرجاء اختيار المصنع أولاً';
                return;
            }
            const modelCode = document.getElementById('newModelCode').value.trim();
            if (!modelCode) {
                document.getElementById('modelErrorMsg').innerHTML = 'الرجاء إدخال كود الموديل';
                return;
            }

            const exists = allModelsList.some(m => (m.code === modelCode || m.name === modelCode) && m.factory ===
                currentFactory);
            if (exists) {
                document.getElementById('modelErrorMsg').innerHTML = 'هذا الموديل موجود بالفعل في هذا المصنع';
                return;
            }

            let finalCode = modelCode;
            const codeExists = allModelsList.some(m => m.code === modelCode || m.name === modelCode);
            if (codeExists) {
                let counter = 1;
                let newCode = `${modelCode}-${counter}`;
                while (allModelsList.some(m => m.code === newCode || m.name === newCode)) {
                    counter++;
                    newCode = `${modelCode}-${counter}`;
                }
                finalCode = newCode;
            }

            const newModelData = { name: finalCode, code: finalCode, factory: currentFactory };
            const newRef = await db.ref('models').push(newModelData);
            await loadAllModels();
            await loadReceivedModelsHistory();
            allModelsList.push({ id: newRef.key, name: finalCode, code: finalCode, factory: currentFactory,
            imageUrl: '' });

            let rowId = null;
            for (const key in csPendingModelSearch) {
                if (csPendingModelSearch[key] === true) {
                    rowId = parseInt(key);
                    break;
                }
            }

            if (rowId) {
                document.getElementById(`csSelectedModel_${rowId}`).value = finalCode;
                const input = document.querySelector(`#cs-model-row-${rowId} .model-search-input`);
                if (input) input.value = finalCode;
                document.getElementById(`csModelSearchResults_${rowId}`).style.display = 'none';
                csConfirmAddModel(rowId);
            } else {
                if (csCurrentData && !csCurrentData.modelColors[finalCode]) {
                    await csAddModelToInventory(csCurrentId, finalCode);
                    renderColorsSizesDetail();
                    scheduleSave();
                }
            }

            document.getElementById('newModelCode').value = '';
            closeModelModal();
            showWarning('تم إضافة الموديل بنجاح', false);
        }

        function csCancelAddModel(rowId) {

        async function csConfirmAddModel(rowId) {
            const modelName = document.getElementById(`csSelectedModel_${rowId}`).value;
            if (!modelName) {

                return;

            const row = document.getElementById(`cs-model-row-${rowId}`);

        async function csAddModelToInventory(id, modelName) {
            const path = `inventory/${id}/modelColors/${modelName}`;
            await db.ref(path).set({});
            await db.ref(`inventory/${id}/modelNotes/${modelName}`).set('');
            await db.ref(`inventory/${id}/modelLocations/${modelName}`).set('');
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());

            if (csCurrentData) {
                csCurrentData.modelColors[modelName] = {};
                if (!csCurrentData.modelNotes) csCurrentData.modelNotes = {};
                csCurrentData.modelNotes[modelName] = '';
                if (!csCurrentData.modelLocations) csCurrentData.modelLocations = {};
                csCurrentData.modelLocations[modelName] = '';
            }
        }

        async function loadFullQtyInventory() {
            const snapshot = await db.ref('inventory').once('value');
            const inventory = [];

            snapshot.forEach((child) => {
                const inv = child.val();
                if (inv.type === 'fullQty' &&
                    inv.assignedEmployeesUsernames &&
                    inv.assignedEmployeesUsernames.includes(currentUser.username)) {
                    inventory.push({ id: child.key, ...inv });
                }
            });

            inventory.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            fqInventoryList = inventory;
            fqPage = 0;
            renderFullQtyList(inventory.slice(0, ITEMS_PER_PAGE));
            updateFullQtyLoadMore(inventory.length);

        function renderFullQtyList(items) {
            const container = document.getElementById('fullQtyList');
            if (items.length === 0 && fqPage === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box"></i>
                        <p>لا توجد فواتير جرد كمية كاملة - أنشئ فاتورة جديدة</p>
                    </div>
                `;
                return;
            }
            if (items.length === 0 && fqPage > 0) return;
            if (fqPage === 0) container.innerHTML = '';

            items.forEach(inv => {
                let totalEntries = 0;
                let totalQty = 0;
                const modelSet = new Set();
                if (inv.fullQtyEntries) {
                    inv.fullQtyEntries.forEach(entry => {
                        if (entry.modelName) {
                            modelSet.add(entry.modelName);
                            totalEntries++;
                            totalQty += parseInt(entry.qty) || 0;
                        }
                    });
                }

                const isClosed = inv.isClosed === true;

                container.innerHTML += `
                    <div class="inventory-card ${isClosed ? 'closed' : ''}" onclick="openFullQtyDetail('${inv.id}')">
                        <div class="inventory-header">

                            <span><i class="fas fa-tags"></i> ${modelSet.size} موديل</span>

        function updateFullQtyLoadMore(totalItems) {
            const btn = document.getElementById('loadMoreFullQtyBtn');
            if (totalItems <= (fqPage + 1) * ITEMS_PER_PAGE) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'flex';
            }
        }

        function loadMoreFullQty() {
            fqPage++;
            const start = fqPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const chunk = fqInventoryList.slice(start, end);
            if (chunk.length > 0) {
                renderFullQtyList(chunk);

            }

            const modelName = document.getElementById('fqSelectedModel').value;
            const qty = parseInt(document.getElementById('fqQtyInput').value) || 0;

            if (!modelName) {
                showWarning('الرجاء اختيار موديل', true);
                return;
            }
            if (qty <= 0) {
                showWarning('الرجاء إدخال كمية صحيحة', true);
                return;
            }

            // Add entry
            const entries = fqCurrentData.fullQtyEntries || [];
            entries.push({ modelName: modelName, qty: qty });

            fqUpdateEntries(fqCurrentId, entries)
                .then(() => {
                    fqCurrentData.fullQtyEntries = entries;
                    renderFullQtyDetail();
                    scheduleSave();
                    // Clear selection
                    document.getElementById('fqSelectedModel').value = '';
                    document.getElementById('fqQtyInput').value = '1';
                    const input = document.querySelector('#fq-new-entry-row .model-search-input');
                    if (input) input.value = '';
                    document.getElementById('fqModelSearchResults').style.display = 'none';
                    showWarning(`تم إضافة ${qty} قطعة للموديل ${modelName}`, false);
                })
                .catch(err => {
                    console.error('Error adding entry:', err);
                    showWarning('حدث خطأ في إضافة الإدخال', true);
                });
        }

        async function fqUpdateEntries(id, entries) {
            await db.ref(`inventory/${id}/fullQtyEntries`).set(entries);

            // Calculate totals per model
            const totals = {};
            entries.forEach(entry => {
                if (entry.modelName) {
                    totals[entry.modelName] = (totals[entry.modelName] || 0) + (parseInt(entry.qty) || 0);
                }
            });
            await db.ref(`inventory/${id}/fullQtyTotals`).set(totals);
            await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
        }

        function fqRemoveEntry(index) {
            if (!fqCurrentId || !fqCurrentData || fqCurrentData.isClosed) {
                showWarning('لا يمكن حذف إدخال في فاتورة مقفلة', true);
                return;
            }

            const entries = fqCurrentData.fullQtyEntries || [];
            if (index < 0 || index >= entries.length) return;

            const entry = entries[index];
            customConfirm(`هل أنت متأكد من حذف الإدخال (${entry.modelName} - ${entry.qty} قطعة)؟`, async (confirmed) => {
                if (confirmed) {
                    entries.splice(index, 1);
                    await fqUpdateEntries(fqCurrentId, entries);
                    fqCurrentData.fullQtyEntries = entries;
                    renderFullQtyDetail();
                    scheduleSave();
                }
            });
        }

        // ================================================================
        //  CLOSE INVENTORY (Shared)
        // ================================================================
        let closeTargetType = 'colorsSizes';

        function openConfirmCloseModal(type) {
            closeTargetType = type || 'colorsSizes';

            let data, id;
            if (type === 'fullQty') {
                if (!fqCurrentId || !fqCurrentData) return;
                data = fqCurrentData;
                id = fqCurrentId;
            } else {
                if (!csCurrentId || !csCurrentData) return;
                data = csCurrentData;
                id = csCurrentId;
            }

            let summaryHtml = '';
            let totalItems = 0;
            let totalQty = 0;

            if (type === 'fullQty') {
                const entries = data.fullQtyEntries || [];
                const modelTotals = {};
                entries.forEach(entry => {
                    if (entry.modelName) {
                        modelTotals[entry.modelName] = (modelTotals[entry.modelName] || 0) + (parseInt(entry
                        .qty) || 0);
                    }
                });
                totalItems = Object.keys(modelTotals).length;
                totalQty = Object.values(modelTotals).reduce((a, b) => a + b, 0);

                for (const modelName in modelTotals) {
                    summaryHtml += `
                        <div class="close-summary-item">
                            <span><strong>${modelName}</strong></span>
                            <span>${modelTotals[modelName]} قطعة</span>
                        </div>
                    `;
                }
            } else {
                for (const modelName in data.modelColors || {}) {
                    const modelTotal = calculateTotalForModel(data, modelName);
                    if (modelTotal > 0) totalItems++;
                    totalQty += modelTotal;
                    const isClosed = data.closedModels?.[modelName] === true;
                    summaryHtml += `
                        <div class="close-summary-item">
                            <span><strong>${modelName}</strong> ${isClosed ? '✅ مقفل' : ''}</span>
                            <span>${modelTotal} قطعة</span>
                        </div>
                    `;
                }
            }

            if (totalItems === 0) {
                summaryHtml =
                `<div class="close-summary-item"><span>⚠️ لم يتم استلام أي كميات في هذه الفاتورة</span></div>`;
            }

            document.getElementById('closeSummary').innerHTML = summaryHtml;

            const warningDiv = document.querySelector('#confirmCloseModal .close-warning');
            if (totalItems === 0) {
                warningDiv.innerHTML =
                    `<i class="fas fa-exclamation-triangle"></i> تحذير: لم يتم استلام أي كميات في هذه الفاتورة. هل أنت متأكد من إقفالها؟`;
                warningDiv.style.display = 'block';
                warningDiv.style.backgroundColor = '#fef5f5';
                warningDiv.style.borderColor = '#fce4e4';
            } else {
                warningDiv.innerHTML =
                    `<i class="fas fa-check-circle"></i> تم استلام ${totalQty} قطعة في ${totalItems} موديل. هل تريد إقفال الجرد؟`;
                warningDiv.style.backgroundColor = '#ddf4e8';
                warningDiv.style.borderColor = '#b8e6d4';
            }

            document.getElementById('confirmCloseModal').style.display = 'flex';
            document.getElementById('confirmCloseBtn').onclick = function() {
                confirmCloseInventory(type);
            };
        }

        function closeConfirmCloseModal() {
            document.getElementById('confirmCloseModal').style.display = 'none';
        }

        function confirmCloseInventory(type) {
            closeConfirmCloseModal();

            let data, id;
            if (type === 'fullQty') {
                if (!fqCurrentId || !fqCurrentData) return;
                data = fqCurrentData;
                id = fqCurrentId;
            } else {
                if (!csCurrentId || !csCurrentData) return;
                data = csCurrentData;
                id = csCurrentId;
            }

            performCloseInventory(id, type, data)
                .then(() => {
                    showWarning('✅ تم إقفال الجرد بنجاح', false);
                    if (type === 'fullQty') {
                        closeFullQtyDetail(true);
                        loadFullQtyInventory();
                    } else {
                        closeColorsSizesDetail(true);
                        loadColorsSizesInventory();
                    }
                    loadDashboardStats();
                })
                .catch(err => {
                    console.error('Error closing inventory:', err);
                    showWarning('حدث خطأ في إقفال الجرد', true);
                });
        }

        async function performCloseInventory(id, type, data) {
            // Close all open models
            if (type === 'fullQty') {
                // For full qty, we close all entries
                await db.ref(`inventory/${id}/isClosed`).set(true);
                await db.ref(`inventory/${id}/closedDate`).set(new Date().toISOString());
                await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
            } else {
                // Close all models in colors & sizes
                for (const modelName in data.modelColors || {}) {
                    if (data.closedModels?.[modelName] !== true) {
                        await db.ref(`inventory/${id}/closedModels/${modelName}`).set(true);
                        await db.ref(`inventory/${id}/closedModelsDate/${modelName}`).set(new Date().toISOString());
                    }
                }
                await db.ref(`inventory/${id}/isClosed`).set(true);
                await db.ref(`inventory/${id}/closedDate`).set(new Date().toISOString());
                await db.ref(`inventory/${id}/updatedAt`).set(Date.now());
            }

            await loadReceivedModelsHistory();
        }

        // ================================================================
        //  FACTORY QUICK ADD
        // ================================================================
        function openFactoryModal() {
            document.getElementById('factoryModal').style.display = 'flex';
            document.getElementById('quickFactoryName').value = '';
            document.getElementById('factoryErrorMsg').innerHTML = '';
        }

        function closeFactoryModal() { document.getElementById('factoryModal').style.display = 'none'; }

        async function quickAddFactory() {
            const name = document.getElementById('quickFactoryName').value.trim();
            if (!name) { document.getElementById('factoryErrorMsg').innerHTML = 'الرجاء إدخال اسم المصنع'; return; }

            const snapshot = await db.ref('factories').once('value');
            let exists = false;
            snapshot.forEach(child => { if (child.val().name === name) exists = true; });
            if (exists) { document.getElementById('factoryErrorMsg').innerHTML = 'هذا المصنع موجود بالفعل'; return; }

            await db.ref('factories').push({ name });
            await loadAllFactories();
            closeFactoryModal();
            loadInventoryFormData();
            showWarning('تم إضافة المصنع بنجاح', false);
        }

        // ================================================================
        //  MODAL HELPERS
        // ================================================================
        let modalEventListenersAdded = false;

        function setupModalListeners() {
            if (modalEventListenersAdded) return;
            modalEventListenersAdded = true;

            const modal = document.getElementById('customModal');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const confirmBtn = document.getElementById('modalConfirmBtn');

            cancelBtn.addEventListener('click', function() { modal.style.display = 'none'; });
            modal.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.style.display === 'flex') modal.style.display = 'none';
            });
        }

        function customConfirm(message, callback) {
            setupModalListeners();
            const modal = document.getElementById('customModal');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMessage');
            const inputField = document.getElementById('modalInput');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            title.innerText = 'تأكيد';
            msg.innerText = message;
            inputField.style.display = 'none';
            modal.style.display = 'flex';

            const onConfirm = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(true);
            };
            const onCancel = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(false);
            };

            confirmBtn.addEventListener('click', onConfirm);
            cancelBtn.addEventListener('click', onCancel);
        }

        function customPrompt(message, placeholder, callback) {
            setupModalListeners();
            const modal = document.getElementById('customModal');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMessage');
            const inputField = document.getElementById('modalInput');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            title.innerText = 'إدخال';
            msg.innerText = message;
            inputField.style.display = 'block';
            inputField.placeholder = placeholder || '';
            inputField.value = '';
            modal.style.display = 'flex';

            const onConfirm = () => {
                const value = inputField.value;
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(value);
            };
            const onCancel = () => {
                modal.style.display = 'none';
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                callback(null);
            };

            confirmBtn.addEventListener('click', onConfirm);
            cancelBtn.addEventListener('click', onCancel);
        }

        // ================================================================
        //  LOGOUT
        // ================================================================
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ================================================================
        //  STARTUP
        // ================================================================
        checkAuth();

        console.log('📌 عدادات: عدد الفواتير، عدد الموديلات، إجمالي الكميات، الجاري');
        console.log('📌 حفظ تلقائي بعد التعديل');
        console.log('📌 إقفال الموديلات والفاتورة بالكامل');
        console.log('📌 فتح وقفل أنيق للمنتجات والألوان (في التبويب الأول)');
        console.log('📌 أزرار فتح/غلق الكل للمنتجات والألوان (في التبويب الأول)');
    </script>
