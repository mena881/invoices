<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصانع - نظام إدارة الاستلامات</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --secondary: #7c3aed;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --dark: #0f172a;
            --dark-secondary: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #f1f5f9;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: white;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0,0,0,0.15);
            transform: translateX(0);
        }

        .sidebar.hidden { transform: translateX(100%); }

        .sidebar-header {
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 15px;
        }

        .sidebar-header .logo-icon {
            font-size: 40px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
        }

        .sidebar-menu li {
            padding: 12px 16px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar-menu li i { width: 22px; font-size: 16px; }
        .sidebar-menu li:hover { 
            background: rgba(255,255,255,0.08); 
            color: white;
            transform: translateX(-4px);
        }
        .sidebar-menu li.active { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white;
            box-shadow: 0 4px 15px rgba(79,70,229,0.4);
        }

        .logout-btn {
            margin: 20px 15px 30px;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            width: calc(100% - 30px);
        }
        .logout-btn:hover { 
            background: var(--danger); 
            border-color: var(--danger);
            color: white;
        }

        .main-content {
            margin-right: 280px;
            padding: 20px 25px;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }
        .main-content.sidebar-hidden { margin-right: 0; }

        .header {
            background: white;
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            background: var(--dark-secondary);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 12px;
            transition: var(--transition);
        }
        .menu-toggle:hover { background: var(--primary); }

        .header h1 {
            font-size: 22px;
            color: var(--dark-secondary);
            font-weight: 700;
        }
        .header h1 i { color: var(--primary); margin-left: 10px; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--light);
            padding: 6px 16px 6px 20px;
            border-radius: 40px;
            border: 1px solid var(--gray-light);
        }
        .user-info i { font-size: 22px; color: var(--primary); }
        .user-info span { font-weight: 600; color: var(--dark-secondary); font-size: 14px; }

        .table-container {
            background: white;
            border-radius: var(--radius);
            padding: 22px 24px;
            overflow-x: auto;
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .table-container .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .table-container h3 {
            font-size: 18px;
            color: var(--dark-secondary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .table-container h3 i { color: var(--primary); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--gray-light); }
        th { 
            background: var(--light); 
            color: var(--gray); 
            font-weight: 600; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover { background: var(--light); }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,70,229,0.4); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        .btn-info { background: var(--info); color: white; }
        .btn-info:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 2px solid var(--gray-light); color: var(--dark-secondary); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            animation: slideUp 0.3s ease;
            font-weight: 600;
        }
        .toast.error { background: var(--danger); }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 992px) {
            .main-content { margin-right: 0; }
            .sidebar { transform: translateX(100%); }
            .sidebar.visible { transform: translateX(0); }
            .sidebar.hidden { transform: translateX(100%); }
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 17px; }
            .table-container { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content" id="mainContent">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1><i class="fas fa-industry"></i> إدارة المصانع</h1>
            </div>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="currentAdminName">مرحباً، مدير النظام</span>
            </div>
        </div>

        <div class="table-container">
            <div class="section-header">
                <h3><i class="fas fa-industry"></i> إدارة المصانع</h3>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
                <input type="text" id="newFactoryName" placeholder="اسم المصنع" style="flex:1;min-width:150px;padding:10px 16px;border:2px solid var(--gray-light);border-radius:var(--radius-sm);">
                <button class="btn btn-primary" onclick="addFactory()"><i class="fas fa-plus"></i> إضافة</button>
            </div>
            <table>
                <thead><tr><th>#</th><th>اسم المصنع</th><th>إجراءات</th></tr></thead>
                <tbody id="factoriesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>

    <script>
        // ============================================================
        // UI HELPERS
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('visible');
            mainContent.classList.toggle('sidebar-hidden');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.menu-toggle');
            const mainContent = document.getElementById('mainContent');
            
            const isSidebarVisible = sidebar.classList.contains('visible') && !sidebar.classList.contains('hidden');
            
            if (isSidebarVisible) {
                const isClickInsideSidebar = sidebar.contains(event.target);
                const isClickOnMenuToggle = menuToggle && menuToggle.contains(event.target);
                
                if (!isClickInsideSidebar && !isClickOnMenuToggle) {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('visible');
                    mainContent.classList.remove('sidebar-hidden');
                }
            }
        });

        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (window.innerWidth > 992) {
                sidebar.classList.remove('hidden');
                sidebar.classList.remove('visible');
                mainContent.classList.remove('sidebar-hidden');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('visible');
                mainContent.classList.add('sidebar-hidden');
            }
        });

        // ============================================================
        // LOAD FACTORIES
        // ============================================================
        async function loadFactories() {
            const snapshot = await db.ref('factories').once('value');
            const tbody = document.getElementById('factoriesTableBody');
            tbody.innerHTML = '';
            let i = 1;
            snapshot.forEach(child => {
                const name = child.val().name;
                tbody.innerHTML += `
                    <tr>
                        <td>${i++}</td>
                        <td><strong>${name}</strong></td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteFactory('${child.key}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // ============================================================
        // ADD FACTORY
        // ============================================================
        async function addFactory() {
            const name = document.getElementById('newFactoryName').value.trim();
            if (!name) {
                showToast('الرجاء إدخال اسم المصنع', true);
                return;
            }
            const snapshot = await db.ref('factories').once('value');
            let exists = false;
            snapshot.forEach(child => { if (child.val().name === name) exists = true; });
            if (exists) {
                showToast('هذا المصنع موجود بالفعل', true);
                return;
            }
            await db.ref('factories').push({ name });
            loadFactories();
            document.getElementById('newFactoryName').value = '';
            showToast('✅ تم إضافة المصنع بنجاح');
        }

        // ============================================================
        // DELETE FACTORY
        // ============================================================
        function deleteFactory(id) {
            if (confirm('تأكيد حذف هذا المصنع؟')) {
                db.ref(`factories/${id}`).remove().then(() => {
                    loadFactories();
                    showToast('✅ تم حذف المصنع بنجاح');
                });
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        loadLayout();
        loadFactories();
    </script>

</body>
</html>
