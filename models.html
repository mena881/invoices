<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموديلات - نظام إدارة الاستلامات</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --secondary: #7c3aed;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --dark: #0f172a;
            --dark-secondary: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #f1f5f9;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: white;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0,0,0,0.15);
            transform: translateX(0);
        }

        .sidebar.hidden { transform: translateX(100%); }

        .sidebar-header {
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 15px;
        }

        .sidebar-header .logo-icon {
            font-size: 40px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
        }

        .sidebar-menu li {
            padding: 12px 16px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .sidebar-menu li i { width: 22px; font-size: 16px; }
        .sidebar-menu li:hover { 
            background: rgba(255,255,255,0.08); 
            color: white;
            transform: translateX(-4px);
        }
        .sidebar-menu li.active { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white;
            box-shadow: 0 4px 15px rgba(79,70,229,0.4);
        }

        .logout-btn {
            margin: 20px 15px 30px;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            width: calc(100% - 30px);
        }
        .logout-btn:hover { 
            background: var(--danger); 
            border-color: var(--danger);
            color: white;
        }

        .main-content {
            margin-right: 280px;
            padding: 20px 25px;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }
        .main-content.sidebar-hidden { margin-right: 0; }

        .header {
            background: white;
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            background: var(--dark-secondary);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 12px;
            transition: var(--transition);
        }
        .menu-toggle:hover { background: var(--primary); }

        .header h1 {
            font-size: 22px;
            color: var(--dark-secondary);
            font-weight: 700;
        }
        .header h1 i { color: var(--primary); margin-left: 10px; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--light);
            padding: 6px 16px 6px 20px;
            border-radius: 40px;
            border: 1px solid var(--gray-light);
        }
        .user-info i { font-size: 22px; color: var(--primary); }
        .user-info span { font-weight: 600; color: var(--dark-secondary); font-size: 14px; }

        .table-container {
            background: white;
            border-radius: var(--radius);
            padding: 22px 24px;
            overflow-x: auto;
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .table-container .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .table-container h3 {
            font-size: 18px;
            color: var(--dark-secondary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .table-container h3 i { color: var(--primary); }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .search-bar input, .search-bar select {
            padding: 10px 16px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            flex: 1;
            min-width: 150px;
            font-size: 14px;
            transition: var(--transition);
            background: white;
        }
        .search-bar input:focus, .search-bar select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
        }

        .models-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }
        .model-gallery-item {
            background: white;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-light);
            padding: 12px;
            text-align: center;
            transition: var(--transition);
        }
        .model-gallery-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-3px);
        }
        .model-gallery-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .model-gallery-item .model-name {
            font-weight: 600;
            color: var(--dark-secondary);
            margin-top: 8px;
            font-size: 14px;
        }
        .model-gallery-item .model-factory {
            font-size: 12px;
            color: var(--gray);
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,70,229,0.4); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-info { background: var(--info); color: white; }
        .btn-info:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 8px 16px;
            background: var(--gray-light);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 13px;
            color: var(--dark-secondary);
        }
        .pagination button.active { 
            background: var(--primary); 
            color: white;
            box-shadow: 0 2px 10px rgba(79,70,229,0.3);
        }
        .pagination button:hover:not(.active) { background: #cbd5e1; }

        .text-muted { color: var(--gray); font-size: 13px; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            animation: slideUp 0.3s ease;
            font-weight: 600;
        }
        .toast.error { background: var(--danger); }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s ease;
            cursor: pointer;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content {
            background: white;
            padding: 30px 35px;
            border-radius: 24px;
            max-width: 500px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            cursor: default;
            position: relative;
        }
        .modal-content h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-content h3 i { color: var(--primary); }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 22px;
            flex-wrap: wrap;
        }
        .modal-close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray);
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close-btn:hover { color: var(--danger); transform: rotate(90deg); }

        @media (max-width: 992px) {
            .main-content { margin-right: 0; }
            .sidebar { transform: translateX(100%); }
            .sidebar.visible { transform: translateX(0); }
            .sidebar.hidden { transform: translateX(100%); }
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 17px; }
            .models-gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content" id="mainContent">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1><i class="fas fa-tshirt"></i> إدارة الموديلات</h1>
            </div>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="currentAdminName">مرحباً، مدير النظام</span>
            </div>
        </div>

        <div class="table-container">
            <div class="section-header">
                <h3><i class="fas fa-tshirt"></i> إدارة الموديلات</h3>
            </div>
            <div class="search-bar">
                <input type="text" id="modelSearchInput" placeholder="🔍 بحث بالموديل..." onkeyup="filterModels()">
                <select id="modelFactoryFilter" onchange="filterModels()">
                    <option value="">كل المصانع</option>
                </select>
            </div>
            <div id="modelsGalleryContainer" class="models-gallery"></div>
            <div id="modelsPaginationContainer" class="pagination"></div>
        </div>
    </div>

    <!-- Image View Modal -->
    <div id="imageViewModal" class="modal" onclick="closeModalOnOutsideClick(event, 'imageViewModal')">
        <div class="modal-content" style="max-width:500px;text-align:center;">
            <button class="modal-close-btn" onclick="closeImageViewModal()"><i class="fas fa-times"></i></button>
            <h3><i class="fas fa-image"></i> معاينة الصورة</h3>
            <img id="fullImageView" src="" style="max-width:100%;max-height:400px;border-radius:12px;margin:16px 0;">
            <div class="modal-buttons"><button class="btn btn-outline" onclick="closeImageViewModal()">إلغاء</button></div>
        </div>
    </div>

    <script src="main.js"></script>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let allModels = [];
        let filteredModels = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        // ============================================================
        // UI HELPERS
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('visible');
            mainContent.classList.toggle('sidebar-hidden');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.menu-toggle');
            const mainContent = document.getElementById('mainContent');
            
            const isSidebarVisible = sidebar.classList.contains('visible') && !sidebar.classList.contains('hidden');
            
            if (isSidebarVisible) {
                const isClickInsideSidebar = sidebar.contains(event.target);
                const isClickOnMenuToggle = menuToggle && menuToggle.contains(event.target);
                
                if (!isClickInsideSidebar && !isClickOnMenuToggle) {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('visible');
                    mainContent.classList.remove('sidebar-hidden');
                }
            }
        });

        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (window.innerWidth > 992) {
                sidebar.classList.remove('hidden');
                sidebar.classList.remove('visible');
                mainContent.classList.remove('sidebar-hidden');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('visible');
                mainContent.classList.add('sidebar-hidden');
            }
        });

        // ============================================================
        // LOAD MODELS
        // ============================================================
        async function loadModels() {
            const snapshot = await db.ref('models').once('value');
            allModels = [];
            snapshot.forEach(child => {
                allModels.push({
                    id: child.key,
                    name: child.val().name,
                    factory: child.val().factory || '',
                    imageUrl: child.val().imageUrl || '',
                    code: child.val().code || ''
                });
            });

            // Load factories for filter
            const factorySnapshot = await db.ref('factories').once('value');
            const filterSelect = document.getElementById('modelFactoryFilter');
            filterSelect.innerHTML = '<option value="">كل المصانع</option>';
            factorySnapshot.forEach(child => {
                filterSelect.innerHTML += `<option value="${child.val().name}">${child.val().name}</option>`;
            });

            filterModels();
        }

        // ============================================================
        // FILTER MODELS
        // ============================================================
        function filterModels() {
            const search = document.getElementById('modelSearchInput').value.toLowerCase();
            const factory = document.getElementById('modelFactoryFilter').value;
            
            filteredModels = allModels.filter(m =>
                (m.name.toLowerCase().includes(search)) &&
                (factory === '' || m.factory === factory)
            );
            
            currentPage = 1;
            renderModels();
        }

        // ============================================================
        // RENDER MODELS
        // ============================================================
        function renderModels() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = Math.min(start + itemsPerPage, filteredModels.length);
            const pageModels = filteredModels.slice(start, end);
            
            const container = document.getElementById('modelsGalleryContainer');
            const paginationContainer = document.getElementById('modelsPaginationContainer');
            
            container.innerHTML = '';
            
            if (pageModels.length === 0) {
                container.innerHTML = '<p class="text-muted" style="text-align:center;padding:30px 0;">لا توجد موديلات مطابقة</p>';
                paginationContainer.innerHTML = '';
                return;
            }

            pageModels.forEach(model => {
                container.innerHTML += `
                    <div class="model-gallery-item">
                        ${model.imageUrl 
                            ? `<img src="${model.imageUrl}" onclick="showFullImage('${model.imageUrl}')" alt="${model.name}">` 
                            : `<div style="height:140px;background:var(--gray-light);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:13px;"><i class="fas fa-image"></i> لا توجد صورة</div>`
                        }
                        <div class="model-name">${model.name}</div>
                        <div class="model-factory">🏭 ${model.factory || 'بدون مصنع'}</div>
                        ${model.code ? `<div style="font-size:11px;color:var(--gray);"><i class="fas fa-tag"></i> ${model.code}</div>` : ''}
                        <div style="margin-top:6px;">
                            <button class="btn btn-danger btn-xs" onclick="deleteModel('${model.id}')"><i class="fas fa-trash"></i></button>
                            ${model.imageUrl ? `<button class="btn btn-info btn-xs" onclick="showFullImage('${model.imageUrl}')"><i class="fas fa-eye"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });

            // Pagination
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredModels.length / itemsPerPage);
            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    paginationContainer.innerHTML += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderModels();
        }

        // ============================================================
        // DELETE MODEL
        // ============================================================
        function deleteModel(id) {
            if (confirm('تأكيد حذف هذا الموديل؟')) {
                db.ref(`models/${id}`).remove().then(() => {
                    loadModels();
                    showToast('✅ تم حذف الموديل بنجاح');
                });
            }
        }

        // ============================================================
        // IMAGE VIEW
        // ============================================================
        function showFullImage(imageUrl) {
            document.getElementById('fullImageView').src = imageUrl;
            document.getElementById('imageViewModal').style.display = 'flex';
        }

        function closeImageViewModal() {
            document.getElementById('imageViewModal').style.display = 'none';
        }

        // ============================================================
        // INIT
        // ============================================================
        loadLayout();
        loadModels();
    </script>

</body>
</html>
