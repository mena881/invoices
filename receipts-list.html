        // ============================================================
        // 9. EDIT QUANTITY
        // ============================================================
        function editQty(receiptId, modelName, color, sizeId, currentQty) {
            const rowId = `qty-${receiptId}-${modelName}-${color}-${sizeId}`;
            const displayCell = document.querySelector(`.qty-display-${rowId}`);
            const row = document.getElementById(rowId);
            if (!displayCell || !row) return;
            
            displayCell.innerHTML = `
                <input type="number" class="qty-input-small" value="${currentQty}" min="0" id="input-${rowId}">
                <button class="qty-save-btn" onclick="saveQty('${receiptId}', '${modelName}', '${color}', '${sizeId}', '${rowId}')">
                    <i class="fas fa-check"></i>
                </button>
                <button class="qty-cancel-btn" onclick="cancelQtyEdit('${rowId}', ${currentQty})">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            const input = document.getElementById(`input-${rowId}`);
            if (input) {
                input.focus();
                input.select();
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        saveQty(receiptId, modelName, color, sizeId, rowId);
                    }
                    if (e.key === 'Escape') {
                        cancelQtyEdit(rowId, currentQty);
                    }
                });
            }
        }

        function cancelQtyEdit(rowId, currentQty) {
            const displayCell = document.querySelector(`.qty-display-${rowId}`);
            if (displayCell) {
                displayCell.textContent = currentQty;
            }
        }

        async function saveQty(receiptId, modelName, color, sizeId, rowId) {
            const input = document.getElementById(`input-${rowId}`);
            if (!input) return;
            
            const newQty = parseInt(input.value);
            if (isNaN(newQty) || newQty < 0) {
                showToast('⚠️ الرجاء إدخال كمية صحيحة', true);
                return;
            }
            
            const displayCell = document.querySelector(`.qty-display-${rowId}`);
            const receipt = allReceipts.find(r => r.id === receiptId);
            if (!receipt) {
                showToast('⚠️ الفاتورة غير موجودة', true);
                return;
            }
            
            const refPath = receipt.isBlank ? `blankReceipts/${receiptId}` : `receipts/${receiptId}`;
            const snapshot = await db.ref(refPath).once('value');
            const data = snapshot.val();
            if (!data) {
                showToast('⚠️ البيانات غير موجودة', true);
                return;
            }
            
            if (data.modelColors && data.modelColors[modelName] && data.modelColors[modelName][color] && data.modelColors[modelName][color][sizeId]) {
                const current = data.modelColors[modelName][color][sizeId];
                if (Array.isArray(current)) {
                    data.modelColors[modelName][color][sizeId] = [newQty];
                } else {
                    data.modelColors[modelName][color][sizeId] = newQty;
                }
            } else {
                if (!data.modelColors) data.modelColors = {};
                if (!data.modelColors[modelName]) data.modelColors[modelName] = {};
                if (!data.modelColors[modelName][color]) data.modelColors[modelName][color] = {};
                data.modelColors[modelName][color][sizeId] = newQty;
            }
            
            let totalQty = 0;
            for (const m in data.modelColors) {
                for (const c in data.modelColors[m]) {
                    for (const s in data.modelColors[m][c]) {
                        const val = data.modelColors[m][c][s];
                        if (Array.isArray(val)) {
                            totalQty += val.reduce((sum, v) => sum + (typeof v === 'number' ? v : 0), 0);
                        } else if (typeof val === 'number') {
                            totalQty += val;
                        }
                    }
                }
            }
            data.receivedQty = totalQty;
            
            await db.ref(refPath).update({
                modelColors: data.modelColors,
                receivedQty: data.receivedQty
            });
            
            displayCell.textContent = newQty;
            
            if (receipt.isBlank) {
                const blankIndex = allReceipts.findIndex(r => r.id === receiptId);
                if (blankIndex !== -1) {
                    allReceipts[blankIndex].modelColors = data.modelColors;
                    allReceipts[blankIndex].receivedQty = data.receivedQty;
                }
            } else {
                const receiptIndex = allReceipts.findIndex(r => r.id === receiptId);
                if (receiptIndex !== -1) {
                    allReceipts[receiptIndex].modelColors = data.modelColors;
                    allReceipts[receiptIndex].receivedQty = data.receivedQty;
                }
            }
            
            if (currentViewReceipt && currentViewReceipt.id === receiptId) {
                currentViewReceipt.modelColors = data.modelColors;
                currentViewReceipt.receivedQty = data.receivedQty;
            }
            
            showToast('✅ تم تحديث الكمية بنجاح');
            viewReceiptDetails(receiptId);
            loadReceiptsList();
        }

        function checkSizeHasSample(receipt, modelName, color, sizeId) {
            if (!receipt) return false;
            if (receipt.sampleRequests) {
                for (const m in receipt.sampleRequests) {
                    if (modelName && m !== modelName) continue;
                    const colors = receipt.sampleRequests[m];
                    for (const c in colors) {
                        if (color && c !== color) continue;
                        if (colors[c] && colors[c][sizeId] === true) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function toggleAccordion(accordionId) {
            const body = document.getElementById(accordionId);
            const icon = document.getElementById(`toggle-${accordionId}`);
            if (body) {
                body.classList.toggle('open');
                if (icon) {
                    icon.classList.toggle('open');
                }
            }
        }

        // ============================================================
        // 10. EXPORT SINGLE RECEIPT TO EXCEL (من داخل الفاتورة)
        // ============================================================
        function exportSingleReceiptToExcel() {
            if (!currentViewReceipt) {
                showToast('⚠️ لا توجد فاتورة للتصدير', true);
                return;
            }
            exportReceiptToExcel(currentViewReceipt);
        }

        function exportSingleReceiptFromCard(receiptId) {
            const receipt = allReceipts.find(r => r.id === receiptId);
            if (!receipt) {
                showToast('⚠️ الفاتورة غير موجودة', true);
                return;
            }
            exportReceiptToExcel(receipt);
        }

        function exportReceiptToExcel(receipt) {
            const data = [];
            
            // Header
            data.push(['تفاصيل الفاتورة']);
            data.push(['كود الفاتورة', receipt.invoiceCode || 'بدون كود']);
            data.push(['المصنع', receipt.factory || 'غير محدد']);
            data.push(['الحالة', getStatusLabel(receipt.status)]);
            data.push(['المسؤول الأساسي', receipt.assignedTo ? receipt.assignedTo.fullName : 'غير مسند']);
            data.push(['المساعدين', receipt.helpers && receipt.helpers.length > 0 ? receipt.helpers.map(h => h.fullName).join(', ') : 'لا يوجد']);
            data.push(['منشئ الفاتورة', receipt.createdBy ? receipt.createdBy.fullName : 'غير معروف']);
            data.push(['تاريخ الإنشاء', receipt.createdAt ? new Date(receipt.createdAt).toLocaleString('ar-EG') : 'غير معروف']);
            if (receipt.closedDate) {
                data.push(['تاريخ الإغلاق', new Date(receipt.closedDate).toLocaleString('ar-EG')]);
            }
            data.push([]);
            
            // Table header
            const headerRow = ['الموديل', 'اللون', 'المقاس', 'الكمية', 'عينة تصوير', 'ملاحظات'];
            data.push(headerRow);
            
            const modelColors = receipt.modelColors || {};
            const modelNotes = receipt.modelNotes || {};
            let hasData = false;
            
            for (const [modelName, colors] of Object.entries(modelColors)) {
                if (typeof colors === 'object' && colors !== null) {
                    for (const [color, sizes] of Object.entries(colors)) {
                        if (typeof sizes === 'object' && sizes !== null) {
                            for (const [sizeId, batches] of Object.entries(sizes)) {
                                const sizeName = getSizeName(sizeId);
                                let qty = 0;
                                if (Array.isArray(batches)) {
                                    qty = batches.reduce((sum, v) => sum + (typeof v === 'number' ? v : 0), 0);
                                } else if (typeof batches === 'number') {
                                    qty = batches;
                                } else if (batches && typeof batches === 'object') {
                                    qty = Object.values(batches).reduce((sum, v) => sum + (typeof v === 'number' ? v : 0), 0);
                                }
                                if (qty > 0) {
                                    const hasSample = checkSizeHasSample(receipt, modelName, color, sizeId);
                                    const note = modelNotes[modelName] || '';
                                    data.push([
                                        modelName,
                                        color,
                                        sizeName,
                                        qty,
                                        hasSample ? '✅ تم التصوير' : '❌ لم يتم',
                                        note
                                    ]);
                                    hasData = true;
                                }
                            }
                        }
                    }
                }
            }
            
            // If no data in modelColors, try models array
            if (!hasData && receipt.models && receipt.models.length > 0) {
                for (const model of receipt.models) {
                    data.push([
                        model.modelName || 'غير محدد',
                        '-',
                        'جميع المقاسات',
                        model.quantity || 0,
                        '❌',
                        modelNotes[model.modelName] || ''
                    ]);
                }
                hasData = true;
            }
            
            if (!hasData) {
                data.push(['لا توجد موديلات', '-', '-', 0, '❌', '']);
            }
            
            // Summary
            data.push([]);
            data.push(['ملخص الفاتورة']);
            data.push(['إجمالي المطلوب', receipt.totalRequiredQty || 0]);
            data.push(['إجمالي المستلم', receipt.receivedQty || 0]);
            data.push(['المتبقي', (receipt.totalRequiredQty || 0) - (receipt.receivedQty || 0)]);
            
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [
                { wch: 20 }, { wch: 15 }, { wch: 12 }, { wch: 12 }, { wch: 15 }, { wch: 25 }
            ];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'تفاصيل الفاتورة');
            XLSX.writeFile(wb, `فاتورة_${receipt.invoiceCode || 'بدون_كود'}_${new Date().toISOString().slice(0, 10)}.xlsx`);
            
            showToast('✅ تم تصدير الفاتورة بنجاح');
        }

        function getStatusLabel(status) {
            const labels = {
                'new': 'جديدة',
                'assigned': 'مسندة',
                'in_progress': 'تحت التنفيذ',
                'completed': 'مكتملة',
                'closed': 'مغلقة',
                'cancelled': 'ملغية',
                'blank': 'Blank'
            };
            return labels[status] || status || 'غير معروف';
        }

        // ============================================================
        // 11. REASSIGN RECEIPT
        // ============================================================
        async function reassignReceipt() {
            if (!currentViewReceipt) return;

            const status = currentViewReceipt.status || 'new';
            if (status === 'closed' || status === 'completed' || status === 'cancelled') {
                showToast('⚠️ لا يمكن إعادة إسناد فاتورة مغلقة أو مكتملة', true);
                return;
            }

            const select = document.getElementById('reassignSelect');
            const selectedUserId = select.value;
            if (!selectedUserId) {
                showToast('الرجاء اختيار موظف', true);
                return;
            }

            const selectedOption = select.options[select.selectedIndex];
            const newAssignedTo = {
                userId: selectedUserId,
                username: selectedOption.dataset.username || '',
                fullName: selectedOption.dataset.fullname || '',
                assignedAt: firebase.database.ServerValue.TIMESTAMP,
                assignedBy: {
                    userId: 'admin',
                    username: 'admin',
                    fullName: 'مدير النظام'
                }
            };

            const oldAssigned = currentViewReceipt.assignedTo;
            const oldName = oldAssigned ? oldAssigned.fullName : null;
            const oldUserId = oldAssigned ? oldAssigned.userId : null;

            const updates = {
                assignedTo: newAssignedTo,
                status: 'assigned'
            };

            const historyEntry = {
                fromUserId: oldUserId,
                fromName: oldName,
                toUserId: newAssignedTo.userId,
                toName: newAssignedTo.fullName,
                byUserId: 'admin',
                byName: 'مدير النظام',
                assignedAt: firebase.database.ServerValue.TIMESTAMP
            };

            const currentHistory = currentViewReceipt.assignmentHistory || [];
            updates.assignmentHistory = [...currentHistory, historyEntry];

            const refPath = currentViewReceipt.isBlank ? `blankReceipts/${currentViewReceipt.id}` : `receipts/${currentViewReceipt.id}`;
            await db.ref(refPath).update(updates);

            showToast('✅ تم إسناد الفاتورة إلى ' + newAssignedTo.fullName);

            const updatedReceipt = { ...currentViewReceipt, ...updates };
            currentViewReceipt = updatedReceipt;

            await viewReceiptDetails(currentViewReceipt.id);
            loadReceiptsList();
        }

        // ============================================================
        // 12. DELETE RECEIPT
        // ============================================================
        function deleteReceipt(id) {
            if (confirm('تأكيد حذف هذه الفاتورة؟')) {
                const receipt = allReceipts.find(r => r.id === id);
                const refPath = receipt && receipt.isBlank ? `blankReceipts/${id}` : `receipts/${id}`;
                db.ref(refPath).remove().then(() => {
                    loadReceiptsList();
                    showToast('✅ تم حذف الفاتورة بنجاح');
                }).catch(err => {
                    showToast('⚠️ حدث خطأ أثناء الحذف', true);
                });
            }
        }

        function closeReceiptViewModal() {
            document.getElementById('receiptViewModal').style.display = 'none';
            currentViewReceipt = null;
        }

        // ============================================================
        // 13. INIT
        // ============================================================
        loadLayout();
        loadSizesMap().then(() => {
            loadReceiptsList();
        });
    </script>

</body>
